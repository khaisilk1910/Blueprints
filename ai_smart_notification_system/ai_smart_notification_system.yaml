blueprint:
  name: AI Smart Notification System
  description: >
    ### 📢 Tạo nội dung ngẫu nhiên bằng AI và gửi Thông báo lên điện thoại, zalo, telegram, Discord và ra loa khi kích hoạt

    <details>
    <summary><b>Chi tiết:</b> - Nhấn để mở rộng</summary>

      **Phiên bản: v.2025.10.25**
        

      **Tác giả: Khaisilk1910 - Nguyễn Tiến Khải**

        1- **Triggers:** Các trigger để kích hoạt hành động

        2- **Tùy chọn tạo nội dung ngẫu nhiên bằng AI và gửi Thông báo lên điện thoại, zalo, telegram, Discord và ra loa khi kích hoạt 💬🔉**
        
        3- **Actions Settings:** Nếu gửi thông báo lên Hass sẽ có thêm tùy chọn Actions trên thông báo để thực hiện Actions ngay trên thông báo Hass.
        
        4- **Repeat**: Tùy chọn sử dụng vòng lặp để lặp lại thông báo nếu muốn.

        5- **Có thể tùy chọn gửi thông báo lên nhiều Điện thoại, Telegram và lên nhiều Loa được tính hợp trong Home Assistant.**
        
        6- **Có thể thêm nhiều Hành động tùy chọn nếu muốn thực hiện.**
        
        7- **Có thể thêm nhiều Điều kiện để chạy Automation**
    </details>      

  domain: automation
  input:

    global_triggers:
      name: Triggers
      description: Thêm Trigger để kích hoạt Automation này
      default: []
      selector:
        trigger:

    ai_structure_description:
      name: Structure Description
      description: |
        Nhập nội dung thông báo bạn muốn ở đây
        Nội dung này sẽ được AI thay đổi ngẫu nhiên tránh nhàm chán mỗi lần lặp thông báo.
        Tham khảo thêm tại: https://www.home-assistant.io/integrations/ai_task/
      default: >
        Hai bạn Sóc Chíp đến giờ uống thuốc rồi. Hãy đi uống thuốc thôi.
      selector:
        text:
          multiline: true
              
    repeat_settings:
      name: "Repeat Notify Settings"
      icon: mdi:repeat-variant
      collapsed: true
      input:
        repeat_types:
          name: Repeat Notify Option (Optional)
          description: |
            Enable loại Vòng Lặp nếu muốn lặp gửi thông báo
            Chọn loại nào thì nhập điều kiện tương ứng bên dưới
            Tham khảo thêm: https://www.home-assistant.io/docs/scripts/#repeat-a-group-of-actions
          default: disable_repeat
          selector:
            select:
              options:
                - label: Disable Repeat
                  value: "disable_repeat"
                - label: Count
                  value: "count_repeat"
                - label: Until
                  value: "until_repeat"
                - label: While
                  value: "while_repeat"
                - label: For each
                  value: "for_each_repeat"
        repeat_count:
          name: Count
          description: >
            Lặp lại hành động n lần
            Tham khảo thêm: https://www.home-assistant.io/docs/scripts/#repeat-a-group-of-actions
          selector:
            number:
              min: 1
              max: 20
              step: 1
              unit_of_measurement: count
          default: 5
        repeat_until:
          name: Until
          description: >
            Lặp lại hành động trừ khi điều kiện là đúng
            Tham khảo thêm: https://www.home-assistant.io/docs/scripts/#repeat-a-group-of-actions
          default: []
          selector:
            condition:
        repeat_while:
          name: While
          description: >
            Lặp lại hành động trong khi điều kiện là đúng
            Tham khảo thêm: https://www.home-assistant.io/docs/scripts/#repeat-a-group-of-actions
          default: []
          selector:
            condition:
        repeat_for_each:
          name: For Each
          description: >
            Lặp lại hành động với mỗi phần tử
          default: ""
          selector:
            text:
              multiline: true
        repeat_delay:
          name: Delay after
          description: |
            Thời gian trễ sau mỗi lần lặp lại hành động (tính theo giây)
            Tránh lặp lại hành động quá nhanh hệ thống không phản hồi kịp
            Mặc định delay 1 phút (60s)
          selector:
            number:
              min: 0
              max: 3600
              step: 5
              unit_of_measurement: seconds
          default: 60


    ai_task_settings:
      name: "AI Task Settings"
      icon: mdi:repeat-variant
      collapsed: true
      input:
        ai_powered:
          name: AI Task (Optional)
          description: |
            Sử dụng AI để thay đổi ngẫu nhiên nội dung mỗi lần gửi thông báo.
            Tham khảo thêm tại: https://www.home-assistant.io/integrations/ai_task/
          default: true
          selector:
            boolean: {}
        ai_task_entity_id:
          name: Entity ID of AI Task
          description: |
            Chọn AI sủ dụng cho việc tạo nội dung.
            Nếu không Bật sử dụng AI bên trên không cần chọn
          selector:
            entity:
              domain: ai_task
          default: ""
        ai_task_name:
          name: Task Name
          description: >
            Nhập Tiêu đề cho Task
          default: >
            Thông báo
          selector:
            text:
              multiline: true
        ai_instructions:
          name: Instructions
          description: |
            Chuỗi chứa các hướng dẫn cụ thể để AI tuân theo khi tạo văn bản.
            Tùy theo sự sáng tạo và yêu cầu bạn muốn để có thể thay đổi các hướng dẫn mẫu sẵn có.
          default: |
            Tạo một thông báo hài hước
            - Phải sử dụng Tiếng Việt có đầy đủ dấu
            - Bỏ qua các ký tự đặc biệt(*, emoji,..)
            - Bỏ qua các dòng trống
            - Chỉ thể hiện văn bản thuần
          selector:
            text:
              multiline: true


    device_notify_settings:
      name: "Mobile App Notify"
      icon: mdi:devices
      collapsed: true
      input:
        include_notify:
          name: Use The Mobile App Notify Option (Optional)
          description: |
            Enable nếu muốn gửi thông báo lên điện thoại đã chọn bên dưới.
            Xem thêm tại https://companion.home-assistant.io/docs/notifications/notifications-basic
          default: false
          selector:
            boolean: {}

        is_ios_android:
          name: Is it an Android or iOS device?
          description: |
            Chọn điện thoại đẩy thông báo là Android hay iOS?
          default: android_device
          selector:
            select:
              options:
                - label: Android
                  value: "android_device"
                - label: iOS
                  value: "ios_device"
        notify_device:
          name: Devices Notified
          description: |
            Chọn Điện thoại muốn thông bảo đẩy lên.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true
        notify_title:
          name: Title
          description: |
            Nhập Title của Thông báo.
            Có thẻ dùng CSS HTML để thiết lập màu sắc, In đậm,... cho nội dung
          default: >
            📢 <b><span style="color: red">Thông báo</span></b>
          selector:
            text:
        tap_navigate:
          name: Tap Navigate
          description: |
            Mở Home Assistant và đi đến vị trí bên dưới khi Thông báo được mở.
            Ví dụ: /lovelace/cameras.
          default: /lovelace
          selector:
            text:
              multiline: false
              multiple: false
        status_bar_icon:
          name: "🌠 Status Bar Icon"
          description: |
            `Dành cho Android`
            Thiết lập icon cho thông báo trên Status Bar điện thoại
            Tìm icon tại https://pictogrammers.com/library/mdi/
          default: mdi:motion-sensor
          selector:
            icon:
              placeholder: mdi:motion-sensor
        notification_color:
          name: "🎨 Notification Color"
          description: |
            `Dành cho Android`
            Thiết lập màu cho icon thông báo trên Status Bar điện thoại
          default: [255, 0, 0]
          selector:
            color_rgb:

    actions_settings:
      name: "Actions Settings"
      icon: mdi:gesture-double-tap
      collapsed: true
      input:
        include_actions:
          name: Use Actions For Mobile App Notify Option (Optional)
          description: |
            Enable nếu muốn có Actions trong thông báo lên điện thoại đã chọn.
            Xem thêm tại https://companion.home-assistant.io/docs/notifications/actionable-notifications
          default: false
          selector:
            boolean: {}
        confirm_text:
          name: "Confirmation Text"
          description: "Text to show on the confirmation button"
          default: "✅ Confirm"
          selector:
            text:
        confirm_action:
          name: "Confirmation Action"
          description: "Action to run when notification is confirmed"
          default: []
          selector:
            action:
        dismiss_text:
          name: "Dismiss Text"
          description: "Text to show on the dismiss button"
          default: "❌ Dismiss"
          selector:
            text:
        enable_custom_dismiss_action:
          name: "Enable Custom Dismiss Action"
          description: "Display notification on Android Auto interface."
          default: false
          selector:
            boolean: {}
        custom_dismiss_action:
          name: "Custom Dismiss Action"
          description: "Action to run when notification is dismissed"
          default: []
          selector:
            action:
        tag:
          name: "\U0001F516 Tag"
          description: |
            Được sử dụng để định danh duy nhất thông báo.
            Tham khảo thêm: https://companion.home-assistant.io/docs/notifications/actionable-notifications
          default: "dimiss_notifications_now"
          selector:
            text: {}
        timeout:
          name: ⌛️ Timeout Duration
          description: |
            Khoảng thời gian chờ phản hồi hành động trước khi kích hoạt hành động khi hết thời gian chờ (timeout).
            Khuyến nghị: tối thiểu 1 phút để đảm bảo thông báo được gửi đi.
            Mặc định: 10 phút.
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration:
              enable_day: false


    zalo_settings:
      name: "Zalo Notifications Settings"
      icon: mdi:message-image-outline
      collapsed: true
      input:
        include_zalo_notify:
          name: Use Zalo Notifications Option (Optional)
          description: |
            Enable nếu muốn gửi thông báo lên Zalo.
            Xem thêm tại https://github.com/smarthomeblack/zalo_bot
          default: false
          selector:
            boolean: {}

        zalo_group_id:
          name: Zalo Group ID
          description: ID của user hoặc nhóm Zalo.
          selector:
            text:
          default: ""

        zalo_phone:
          name: Zalo Acc
          description: Số điện thoại của Zalo Bot.
          selector:
            text:
          default: "+84000000000"

        zalo_types:
          name: Use Zalo Type Option (Optional)
          description: |
            Chọn thông báo lên Zalo cá nhân hoặc group.
            Xem thêm tại https://github.com/smarthomeblack/zalo_bot
          default: "0"
          selector:
            select:
              options:
                - label: User
                  value: "0"
                - label: Group
                  value: "1"
        zalo_ttl:
          name: TTL
          description: Thời gian chờ sau thời gian này tin nhắn sẽ tự xóa.
          selector:
            number:
              min: 0
              max: 86400000
              step: 1000
              unit_of_measurement: seconds
          default: 0

    telegram_settings:
      name: "Telegram Notifications Settings"
      icon: mdi:message-badge
      collapsed: true
      input:
        include_telegram_notify:
          name: Use Telegram Notifications Option (Optional)
          description: |
            Enable nếu muốn gửi thông báo lên Telegram.
            Xem thêm tại https://www.home-assistant.io/integrations/?search=telegram
          default: false
          selector:
            boolean: {}
     
        provider:
          name: Config entry ID
          description: Choose Telegram Bot to use for send Notifications.
          selector:
            config_entry:
              integration: telegram_bot
          default: []

        telegram_group_id:
          name: Telegram Group ID
          description: ID của nhóm Telegram.
          selector:
            text:
          default: ""

        telegram_topic:
          name: Telegram Topic ID
          description: ID của chủ đề trong nhóm Telegram.
          selector:
            text:
          default: ""
            
    discord_settings:
      name: "Discord Notifications Settings"
      icon: mdi:message-bulleted
      collapsed: true
      input:
        include_discord_notify:
          name: Use Discord Notifications Option (Optional)
          description: |
            Enable nếu muốn gửi thông báo lên Discord.
            Xem thêm tại https://www.home-assistant.io/integrations/discord/
          default: false
          selector:
            boolean: {}
        discord_channel:
          name: Discord Channel ID
          description: ID của Channel trong nhóm Discord.
          selector:
            text:
          default: ""

    tts_notify_settings:
      name: "Speakers Settings"
      icon: mdi:speaker-message
      collapsed: true
      input:
        include_tts_announcement:
          name: Use The Text-to-Speech Announcement Option (Optional)
          description: |
            Enable khi muốn gửi TTS ra loa sẽ chọn bên dưới.
            Xem thêm tại https://www.home-assistant.io/integrations/?search=tts
          default: false
          selector:
            boolean: {}
        num_volume_speaker:
          name: Volume Set
          description: Thiết lập Âm lượng cho Loa. ( từ 0.1 đến 1)
          selector:
            number:
              min: 0.1
              max: 1
              step: 0.1
              #unit_of_measurement: snapshots
          default: 1
        text_to_speech_engine:
          name: Text-to-Speech Service Provider
          description: >
            Chọn dịch vụ TTS hỗ trợ.
          default: []
          selector:
            entity:
              filter:
                domain: tts
        media_player:
          name: Media Player
          description: >
            Chọn loa để phát thông báo
          default: []
          selector:
            entity:
              filter:
                domain: media_player
              multiple: true


    custom_actions_settings:
      name: "Custom Actions"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        include_custom_actions:
          name: Use The Custom Action Options (Optional)
          description: |
            Chọn Enable Custom Actions và thêm Actions bên dưới nếu bạn muốn thêm các Hành động khác để thực hiện trong Automation này.
          default: false
          selector:
            boolean: {}
        custom_actions:
          name: Custom Actions
          description: |
            Thêm bất kỳ hành động nào bạn muốn chạy trong Automation này.
            Biến lấy nội dung phân tích AI cho các nội dung khác: `response_thong_bao.data.thong_bao`
          default: []
          selector:
            action:

    global_conditions_settings:
      name: "Global Conditions"
      icon: mdi:earth
      collapsed: true
      input:
        global_conditions:
          name: Add Condition(s) to run this Automation
          description: |
            Thêm Condition để chạy Automation.
            Automation chỉ chạy khi Conditions này là True.
          default: []
          selector:
            condition:

trigger: !input global_triggers

variables:
  #Repeat
  repeat_types: !input repeat_types
  repeat_count: !input repeat_count
  repeat_for_each: !input repeat_for_each
  repeat_delay: !input repeat_delay
  #AI
  ai_powered: !input "ai_powered"
  ai_task_entity_id: !input ai_task_entity_id
  ai_task_name: !input ai_task_name
  ai_instructions: !input ai_instructions
  ai_structure_description: !input ai_structure_description
  #Device Notify
  include_notify: !input "include_notify"
  notify_device: !input notify_device
  notify_title: !input notify_title
  tap_navigate: !input tap_navigate
  filtered_devices: >
    {{ notify_device }}
  is_ios_android: !input "is_ios_android"
  #Actions Settings
  include_actions: !input "include_actions"
  confirm_text: !input confirm_text
  dismiss_text: !input dismiss_text
  timeout: !input timeout
  enable_custom_dismiss_action: !input enable_custom_dismiss_action
  tag: !input tag
  #Zalo Message
  include_zalo_notify: !input "include_zalo_notify"
  #Telegram Message
  include_telegram_notify: !input "include_telegram_notify"
  provider: !input provider
  telegram_group_id: !input telegram_group_id
  telegram_topic: !input telegram_topic
  #Discord
  include_discord_notify: !input "include_discord_notify"
  discord_channel: !input discord_channel
  #TTS Message
  include_tts_announcement: !input "include_tts_announcement"
  num_volume_speaker: !input num_volume_speaker
  text_to_speech_engine: !input text_to_speech_engine
  media_player: !input media_player
  #Custom Actions
  include_custom_actions: !input "include_custom_actions"
  custom_actions: !input custom_actions
  #Global Conditions
  global_conditions: !input global_conditions

# All Conditions
condition:
  # Global Conditions
  - condition: and
    conditions: !input global_conditions

action:
  - variables:
      action_confirm: "{{ 'CONFIRM_' ~ context.id }}"
      action_dismiss: "{{ 'DISMISS_' ~ context.id }}"
      notification_color: !input "notification_color"
      notification_color_hex: "#{{ '%02x%02x%02x' | format(notification_color[0], notification_color[1], notification_color[2]) }}"
  - if:
      - condition: template
        value_template: >
          {{ not (repeat_types == "disable_repeat") }}
    then:
      - choose:
          - alias: "Check if repeat is enabled"
            conditions:
              - "{{ repeat_types == 'count_repeat' }}"
            sequence:
              - repeat:
                  count: "{{repeat_count}}"
                  sequence:
                    - choose:
                        - alias: "Check if AI Task is enabled"
                          conditions:
                            - "{{ ai_powered }}"
                          sequence:
                            - action: ai_task.generate_data
                              metadata: {}
                              data:
                                task_name: "{{ai_task_name}}"
                                entity_id: "{{ai_task_entity_id}}"
                                instructions: >
                                  {{ai_instructions}}
                                structure:
                                  thong_bao:
                                    description: "{{ai_structure_description}}"
                                    required: true
                                    selector:
                                      text: null
                              response_variable: response_thong_bao
                            - variables:
                                ai_task_messages: >
                                  👉 {{ response_thong_bao.data.thong_bao }}{{'\n'}}🕒 {{now().strftime('%H:%M:%S %a, %d-%b-%Y')}}
                            - alias: "Chạy cùng lúc tất cả các Action"
                              parallel:
                                - if:
                                    - condition: template
                                      value_template: "{{ include_notify and (filtered_devices | length > 0) }}"
                                  then:
                                    - if:
                                        - condition: template
                                          value_template: "{{ include_actions }}"
                                      then:
                                        - choose:
                                            - alias: "Check if Android"
                                              conditions:
                                                - "{{ is_ios_android == 'android_device' }}"
                                              sequence:
                                                - alias: Send a notification to each device
                                                  repeat:
                                                    for_each: "{{ filtered_devices }}"
                                                    sequence:
                                                      - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                        data:
                                                          title: !input notify_title
                                                          message: "{{ai_task_messages}}"
                                                          data:
                                                            priority: high
                                                            notification_icon: !input status_bar_icon
                                                            color: "{{ notification_color_hex }}"
                                                            url: "{{tap_navigate}}"
                                                            clickAction: "{{tap_navigate}}"
                                                            tag: "{{ tag }}"
                                                            actions:
                                                              - action: "{{ action_confirm }}"
                                                                title: "{{ confirm_text }}"
                                                              - action: "{{ action_dismiss }}"
                                                                title: "{{ dismiss_text }}"
                                            - alias: "Check if iOS"
                                              conditions:
                                                - "{{ is_ios_android == 'ios_device' }}"
                                              sequence:
                                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                  data:
                                                    title: !input notify_title
                                                    message: >
                                                      {{ai_task_messages}}
                                                    data:
                                                      tag: "{{ tag }}"
                                                      actions:
                                                        - action: "{{ action_confirm }}"
                                                          title: "{{ confirm_text }}"
                                                        - action: "{{ action_dismiss }}"
                                                          title: "{{ dismiss_text }}"
                                        - alias: "Awaiting response"
                                          wait_for_trigger:
                                            - platform: event
                                              event_type: mobile_app_notification_action
                                              event_data:
                                                action: "{{ action_confirm }}"
                                            - platform: event
                                              event_type: mobile_app_notification_action
                                              event_data:
                                                action: "{{ action_dismiss }}"
                                          timeout: '{{ timeout }}'
                                          continue_on_timeout: true
                                        - choose:
                                            - conditions: "{{ wait.trigger.event.data.action == action_confirm }}"
                                              sequence: !input confirm_action
                                            - conditions: "{{ wait.trigger.event.data.action == action_dismiss }}"
                                              sequence:
                                                - alias: Nếu Enable Custom Dismiss Action được Bật thì sẽ hành động theo Custom Dismiss Action. Còn không thì sẽ xóa Thông báo.
                                                  if:
                                                    - condition: template
                                                      value_template: "{{ not enable_custom_dismiss_action}}"
                                                  then:
                                                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                      data:
                                                        message: "clear_notification"
                                                        data:
                                                          tag: "{{ tag }}"
                                                  else: !input custom_dismiss_action
                                      else:
                                        - choose:
                                            - alias: "Check if Android"
                                              conditions:
                                                - "{{ is_ios_android == 'android_device' }}"
                                              sequence:
                                                - alias: Send a notification to each device
                                                  repeat:
                                                    for_each: "{{ filtered_devices }}"
                                                    sequence:
                                                      - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                        data:
                                                          title: !input notify_title
                                                          message: "{{ai_task_messages}}"
                                                          data:
                                                            priority: high
                                                            notification_icon: !input status_bar_icon
                                                            color: "{{ notification_color_hex }}"
                                                            url: "{{tap_navigate}}"
                                                            clickAction: "{{tap_navigate}}"
                                            - alias: "Check if iOS"
                                              conditions:
                                                - "{{ is_ios_android == 'ios_device' }}"
                                              sequence:
                                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                  data:
                                                    title: !input notify_title
                                                    message: "{{ai_task_messages}}"

                                - if:
                                    - condition: template
                                      value_template: "{{ include_zalo_notify }}"
                                  then:
                                    - action: zalo_bot.send_message
                                      metadata: {}
