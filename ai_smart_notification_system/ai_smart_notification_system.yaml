                                                    - "{{ is_ios_android == 'ios_device' }}"
                                                  sequence:
                                                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                      data:
                                                        title: !input notify_title
                                                        message: "{{ai_task_messages}}"

                                    - if:
                                        - condition: template
                                          value_template: "{{ include_zalo_notify }}"
                                      then:
                                        - action: zalo_bot.send_message
                                          metadata: {}
                                          data:
                                            type: !input zalo_types
                                            ttl: !input zalo_ttl
                                            message: "📢 Thông báo{{'\n'}}{{ai_task_messages}}"
                                            thread_id: !input zalo_group_id
                                            account_selection: !input zalo_phone

                                    - if:
                                        - condition: template
                                          value_template: "{{ include_telegram_notify }}"
                                      then:
                                        - action: telegram_bot.send_message
                                          metadata: {}
                                          data:
                                            config_entry_id: "{{ provider }}"
                                            message: "{{ai_task_messages}}"
                                            title: !input notify_title
                                            target: "{{ telegram_group_id }}"
                                            parse_mode: html
                                            message_thread_id: "{{ telegram_topic | int(0) }}"

                                    - if:
                                        - condition: template
                                          value_template: "{{ include_discord_notify }}"
                                      then:
                                        - action: notify.hass_discord
                                          metadata: {}
                                          data:
                                            target: "{{discord_channel | int(0)}}"
                                            title: !input notify_title
                                            message: "{{ai_task_messages}}"

                                    - if:
                                        - condition: template
                                          value_template: "{{ include_tts_announcement }}"
                                      then:
                                        - if:
                                            - condition: template
                                              value_template: "{{ expand(is_custom_media_player) | selectattr('state', 'in', ['playing', 'buffering']) | list | count > 0 }}"
                                          then:
                                            - wait_template: "{{ expand(is_custom_media_player) |selectattr('state', 'in', ['playing', 'buffering', 'unknown', 'unavailable']) |list |count == 0 }}"
                                              timeout: "00:10:00"
                                              continue_on_timeout: true
                                            - if:
                                                - condition: template
                                                  value_template: "{{ wait.completed }}"
                                              then:
                                                - action: media_player.volume_set
                                                  metadata: {}
                                                  data:
                                                    volume_level: "{{num_volume_speaker}}"
                                                  target:
                                                    entity_id: !input media_player
                                                - action: tts.speak
                                                  target:
                                                    entity_id: !input text_to_speech_engine
                                                  data:
                                                    media_player_entity_id: "{{ is_custom_media_player }}"
                                                    message: "{{response_thong_bao.data.thong_bao}}"
                                              else:
                                                - action: media_player.volume_set
                                                  metadata: {}
                                                  data:
                                                    volume_level: "{{num_volume_speaker}}"
                                                  target:
                                                    entity_id: !input media_player
                                                - action: tts.speak
                                                  target:
                                                    entity_id: !input text_to_speech_engine
                                                  data:
                                                    media_player_entity_id: "{{ is_custom_media_player }}"
                                                    message: "{{ is_wait_completed_error }}"
                                          else:
                                            - action: media_player.volume_set
                                              metadata: {}
                                              data:
                                                volume_level: "{{num_volume_speaker}}"
                                              target:
                                                entity_id: !input media_player
                                            - action: tts.speak
                                              target:
                                                entity_id: !input text_to_speech_engine
                                              data:
                                                media_player_entity_id: "{{ is_custom_media_player }}"
                                                message: "{{response_thong_bao.data.thong_bao}}"

                                    - if:
                                        - condition: template
                                          value_template: "{{ include_tts_to_mobile and (filtered_tts_to_mobile | length > 0) }}"
                                      then:
                                        - alias: Send a TTS to each mobile
                                          repeat:
                                            for_each: "{{ filtered_tts_to_mobile }}"
                                            sequence:
                                              - metadata: {}
                                                data:
                                                  message: TTS
                                                  data:
                                                    tts_text: "{{response_thong_bao.data.thong_bao}}"
                                                    media_stream: "{{is_tts_to_mobile_media_stream_types}}"
                                                action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"

                              else:
                                - if:
                                    - condition: template
                                      value_template: "{{ include_zalo_notify }}"
                                  then:
