                                      data:
                                        target: "{{discord_channel | int(0)}}"
                                        title: !input notify_title
                                        message: "{{ai_error_message}}"

                                - if:
                                    - condition: template
                                      value_template: "{{ include_tts_announcement }}"
                                  then:
                                    - if:
                                        - condition: template
                                          value_template: "{{ expand(is_custom_media_player) | selectattr('state', 'in', ['playing', 'buffering']) | list | count > 0 }}"
                                      then:
                                        - wait_template: "{{ expand(is_custom_media_player) |selectattr('state', 'in', ['playing', 'buffering', 'unknown', 'unavailable']) |list |count == 0 }}"
                                          timeout: "00:10:00"
