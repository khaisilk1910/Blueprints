                                      message: "{{response_thong_bao.data.thong_bao}}"
                    else:
                      - if:
                          - condition: template
                            value_template: "{{ include_zalo_notify }}"
                        then:
                          - action: zalo_bot.send_message
                            metadata: {}
                            data:
                              type: !input zalo_types
                              ttl: !input zalo_ttl
                              message: "{{ai_error_message}}"
                              thread_id: !input zalo_group_id
                              account_selection: !input zalo_phone

                      - if:
                          - condition: template
                            value_template: "{{ include_telegram_notify }}"
                        then:
                          - action: telegram_bot.send_message
                            metadata: {}
                            data:
                              config_entry_id: "{{ provider }}"
                              message: "{{ai_error_message}}"
                              title: !input notify_title
                              target: "{{ telegram_group_id }}"
                              parse_mode: html
                              message_thread_id: "{{ telegram_topic | int(0) }}"

                      - if:
                          - condition: template
                            value_template: "{{ include_discord_notify }}"
                        then:
                          - action: notify.hass_discord
                            metadata: {}
                            data:
                              target: "{{discord_channel | int(0)}}"
                              title: !input notify_title
                              message: "{{ai_error_message}}"

                      - if:
                          - condition: template
                            value_template: "{{ include_tts_to_mobile and (filtered_tts_to_mobile | length > 0) }}"
                        then:
                          - alias: Send a TTS to each mobile
                            repeat:
                              for_each: "{{ filtered_tts_to_mobile }}"
                              sequence:
                                - metadata: {}
                                  data:
                                    message: TTS
                                    data:
                                      tts_text: "{{ai_error_message}}"
                                      media_stream: "{{is_tts_to_mobile_media_stream_types}}"
                                  action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"

                      - if:
                          - condition: template
                            value_template: "{{ include_tts_announcement }}"
                        then:
                          - if:
                              - condition: template
                                value_template: "{{ expand(is_custom_media_player) | selectattr('state', 'in', ['playing', 'buffering']) | list | count > 0 }}"
                            then:
                              - wait_template: "{{ expand(is_custom_media_player) |selectattr('state', 'in', ['playing', 'buffering', 'unknown', 'unavailable']) |list |count == 0 }}"
                                timeout: "00:10:00"
                                continue_on_timeout: true
                              - if:
                                  - condition: template
                                    value_template: "{{ wait.completed }}"
                                then:
                                  - action: media_player.volume_set
                                    metadata: {}
                                    data:
                                      volume_level: "{{num_volume_speaker}}"
                                    target:
                                      entity_id: !input media_player
                                  - action: tts.speak
                                    target:
                                      entity_id: !input text_to_speech_engine
                                    data:
                                      media_player_entity_id: "{{ is_custom_media_player }}"
                                      message: "{{ai_error_message}}"
                                else:
                                  - action: media_player.volume_set
                                    metadata: {}
                                    data:
                                      volume_level: "{{num_volume_speaker}}"
                                    target:
                                      entity_id: !input media_player
                                  - action: tts.speak
                                    target:
                                      entity_id: !input text_to_speech_engine
                                    data:
                                      media_player_entity_id: "{{ is_custom_media_player }}"
                                      message: "{{ is_wait_completed_error }}"
                            else:
                              - action: media_player.volume_set
                                metadata: {}
                                data:
                                  volume_level: "{{num_volume_speaker}}"
                                target:
                                  entity_id: !input media_player
                              - action: tts.speak
                                target:
                                  entity_id: !input text_to_speech_engine
                                data:
                                  media_player_entity_id: "{{ is_custom_media_player }}"
                                  message: "{{ai_error_message}}"

              - alias: "Check if AI Task is disable"
                conditions:
                  - "{{ not ai_powered }}"
                sequence:
                  - variables:
                      ai_task_disable_messages: >
                        👉 {{is_message_customs}}{{'\n'}}🕒 {{now().strftime('%H:%M:%S %a, %d-%b-%Y')}}
                  - alias: "Chạy cùng lúc tất cả các Action"
                    parallel:
                      - if:
                          - condition: template
                            value_template: "{{ include_notify and (filtered_devices | length > 0) }}"
                        then:
                          - if:
                              - condition: template
                                value_template: "{{ include_actions }}"
                            then:
                              - choose:
                                  - alias: "Check if Android"
                                    conditions:
                                      - "{{ is_ios_android == 'android_device' }}"
                                    sequence:
                                      - alias: Send a notification to each device
                                        repeat:
                                          for_each: "{{ filtered_devices }}"
                                          sequence:
                                            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                              data:
                                                title: !input notify_title
                                                message: "{{ai_task_disable_messages}}"
                                                data:
                                                  priority: high
                                                  notification_icon: !input status_bar_icon
                                                  color: "{{ notification_color_hex }}"
                                                  url: "{{tap_navigate}}"
                                                  clickAction: "{{tap_navigate}}"
                                                  tag: "{{ tag }}"
                                                  actions:
                                                    - action: "{{ action_confirm }}"
                                                      title: "{{ confirm_text }}"
                                                    - action: "{{ action_dismiss }}"
                                                      title: "{{ dismiss_text }}"
                                  - alias: "Check if iOS"
                                    conditions:
                                      - "{{ is_ios_android == 'ios_device' }}"
                                    sequence:
                                      - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                        data:
                                          title: !input notify_title
                                          message: >
                                            {{ai_task_disable_messages}}
                                          data:
                                            tag: "{{ tag }}"
                                            actions:
                                              - action: "{{ action_confirm }}"
                                                title: "{{ confirm_text }}"
                                              - action: "{{ action_dismiss }}"
                                                title: "{{ dismiss_text }}"
                              - alias: "Awaiting response"
                                wait_for_trigger:
                                  - platform: event
                                    event_type: mobile_app_notification_action
                                    event_data:
                                      action: "{{ action_confirm }}"
                                  - platform: event
                                    event_type: mobile_app_notification_action
                                    event_data:
                                      action: "{{ action_dismiss }}"
                                timeout: '{{ timeout }}'
                                continue_on_timeout: true
                              - choose:
                                  - conditions: "{{ wait.trigger.event.data.action == action_confirm }}"
                                    sequence: !input confirm_action
                                  - conditions: "{{ wait.trigger.event.data.action == action_dismiss }}"
                                    sequence:
                                      - alias: Nếu Enable Custom Dismiss Action được Bật thì sẽ hành động theo Custom Dismiss Action. Còn không thì sẽ xóa Thông báo.
                                        if:
                                          - condition: template
                                            value_template: "{{ not enable_custom_dismiss_action}}"
                                        then:
                                          - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                            data:
                                              message: "clear_notification"
                                              data:
                                                tag: "{{ tag }}"
                                        else: !input custom_dismiss_action
                            else:
                              - choose:
                                  - alias: "Check if Android"
                                    conditions:
                                      - "{{ is_ios_android == 'android_device' }}"
                                    sequence:
                                      - alias: Send a notification to each device
                                        repeat:
                                          for_each: "{{ filtered_devices }}"
                                          sequence:
                                            - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                              data:
                                                title: !input notify_title
                                                message: "{{ai_task_disable_messages}}"
                                                data:
                                                  priority: high
                                                  notification_icon: !input status_bar_icon
                                                  color: "{{ notification_color_hex }}"
                                                  url: "{{tap_navigate}}"
                                                  clickAction: "{{tap_navigate}}"
                                  - alias: "Check if iOS"
                                    conditions:
                                      - "{{ is_ios_android == 'ios_device' }}"
                                    sequence:
                                      - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                        data:
                                          title: !input notify_title
                                          message: "{{ai_task_disable_messages}}"

                      - if:
                          - condition: template
                            value_template: "{{ include_zalo_notify }}"
                        then:
                          - action: zalo_bot.send_message
                            metadata: {}
                            data:
                              type: !input zalo_types
                              ttl: !input zalo_ttl
                              message: "📢 Thông báo{{'\n'}}{{ai_task_disable_messages}}"
                              thread_id: !input zalo_group_id
                              account_selection: !input zalo_phone

                      - if:
                          - condition: template
                            value_template: "{{ include_telegram_notify }}"
                        then:
                          - action: telegram_bot.send_message
                            metadata: {}
                            data:
                              config_entry_id: "{{ provider }}"
                              message: "{{ai_task_disable_messages}}"
                              title: !input notify_title
                              target: "{{ telegram_group_id }}"
                              parse_mode: html
                              message_thread_id: "{{ telegram_topic | int(0) }}"

                      - if:
                          - condition: template
                            value_template: "{{ include_discord_notify }}"
                        then:
                          - action: notify.hass_discord
                            metadata: {}
                            data:
                              target: "{{discord_channel | int(0)}}"
                              title: !input notify_title
                              message: "{{ai_task_disable_messages}}"

                      - if:
                          - condition: template
                            value_template: "{{ include_tts_to_mobile and (filtered_tts_to_mobile | length > 0) }}"
                        then:
                          - alias: Send a TTS to each mobile
                            repeat:
                              for_each: "{{ filtered_tts_to_mobile }}"
                              sequence:
                                - metadata: {}
                                  data:
                                    message: TTS
                                    data:
                                      tts_text: "{{ai_structure_description}}"
                                      media_stream: "{{is_tts_to_mobile_media_stream_types}}"
                                  action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"

                      - if:
                          - condition: template
                            value_template: "{{ include_tts_announcement }}"
                        then:
                          - if:
                              - condition: template
                                value_template: "{{ expand(is_custom_media_player) | selectattr('state', 'in', ['playing', 'buffering']) | list | count > 0 }}"
                            then:
                              - wait_template: "{{ expand(is_custom_media_player) |selectattr('state', 'in', ['playing', 'buffering', 'unknown', 'unavailable']) |list |count == 0 }}"
                                timeout: "00:10:00"
                                continue_on_timeout: true
                              - if:
                                  - condition: template
                                    value_template: "{{ wait.completed }}"
                                then:
                                  - action: media_player.volume_set
                                    metadata: {}
                                    data:
                                      volume_level: "{{num_volume_speaker}}"
                                    target:
                                      entity_id: !input media_player
                                  - action: tts.speak
                                    target:
                                      entity_id: !input text_to_speech_engine
                                    data:
                                      media_player_entity_id: "{{ is_custom_media_player }}"
                                      message: "{{ ai_structure_description }}"
                                else:
                                  - action: media_player.volume_set
                                    metadata: {}
                                    data:
                                      volume_level: "{{num_volume_speaker}}"
                                    target:
                                      entity_id: !input media_player
                                  - action: tts.speak
                                    target:
                                      entity_id: !input text_to_speech_engine
                                    data:
                                      media_player_entity_id: "{{ is_custom_media_player }}"
                                      message: "{{ is_wait_completed_error }}"
                            else:
                              - action: media_player.volume_set
                                metadata: {}
                                data:
                                  volume_level: "{{num_volume_speaker}}"
                                target:
                                  entity_id: !input media_player
                              - action: tts.speak
                                target:
                                  entity_id: !input text_to_speech_engine
                                data:
                                  media_player_entity_id: "{{ is_custom_media_player }}"
                                  message: "{{ai_structure_description}}"

  - choose:
      - alias: "Perform the custom action"
        conditions:
          - condition: template
            value_template: "{{ include_custom_actions }}"
        sequence: !input custom_actions

mode: queued
max: 10
max_exceeded: silent
