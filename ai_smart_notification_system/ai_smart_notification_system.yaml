blueprint:
  name: AI Smart Notification System
  description: >
    ### 📢 Tạo nội dung ngẫu nhiên bằng AI và gửi Thông báo lên điện thoại, zalo, telegram, Discord và ra loa khi kích hoạt

    <details>
    <summary><b>Chi tiết:</b> - Nhấn để mở rộng</summary>

      **Phiên bản: v.2026.10.27.1**

        - Thêm bật/tắt TTL Zalo và đủ 9 lựa chọn thời gian.
        - Tắt TTL không truyền trường ttl; giữ các input và luồng TTS hiện có.
        

      **Tác giả: Khaisilk1910 - Nguyễn Tiến Khải**

        1- **Triggers:** Các trigger để kích hoạt hành động

        2- **Tùy chọn tạo nội dung ngẫu nhiên bằng AI và gửi Thông báo lên điện thoại, zalo, telegram, Discord và ra loa khi kích hoạt 💬🔉**
        
        3- **Actions Settings:** Nếu gửi thông báo lên Hass sẽ có thêm tùy chọn Actions trên thông báo để thực hiện Actions ngay trên thông báo Hass.
        
        4- **Repeat**: Tùy chọn sử dụng vòng lặp để lặp lại thông báo nếu muốn.

        5- **Có thể tùy chọn gửi thông báo lên nhiều Điện thoại, Telegram và lên nhiều Loa được tính hợp trong Home Assistant.**
        
        6- **Có thể thêm nhiều Hành động tùy chọn nếu muốn thực hiện.**
        
        7- **Có thể thêm nhiều Điều kiện để chạy Automation**
    </details>      

  domain: automation
  homeassistant:
    min_version: "2026.10.0"


  input:

    global_triggers:
      name: ⚙️ Triggers
      description: Thêm Trigger để kích hoạt Automation này
      default: []
      selector:
        trigger:

    global_conditions:
      name: 🛠️ Add Condition(s) to run this Automation
      description: |
        Thêm Condition để chạy Automation.
        Automation chỉ chạy khi Conditions này là `True`.
      default: []
      selector:
        condition:

    custom_actions_1_settings:
      name: "Custom Actions 1"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        include_custom_1_actions:
          name: ✅ Use The Custom Action Options (Optional)
          description: |
            Chọn Enable Custom Actions và thêm Actions bên dưới.
          default: false
          selector:
            boolean: {}
        custom_actions_1:
          name: 🛠️ Custom Actions
          description: |
            🚨 Action này sẽ chạy đầu tiên trong Automation.
            Sử dụng cho việc muốn chạy Action gì đó trước khi thông báo.
            Thêm bất kỳ hành động nào bạn muốn chạy trong Automation này.
          default: []
          selector:
            action:

    ai_structure_description:
      name: 📝 Structure Description
      description: |
        👉 Nhập nội dung thông báo bạn muốn ở đây.
        ⚠️ Nếu sử dụng AI thì nội dung này sẽ được AI thay đổi ngẫu nhiên tránh nhàm chán mỗi lần lặp thông báo.
        ⚠️ Nếu không sử dụng AI thì thông báo sẽ sử dụng chính xác câu từ trong nội dung này.
        🌐 Tham khảo thêm tại: https://www.home-assistant.io/integrations/ai_task/
      default: |
        Dùng 1 trong các prompt dưới hoặc tạo mới tùy mục đích của thông báo.
        -----------------
        Nhiệm vụ của bạn là tổng hợp dữ liệu trên thành một thông báo chào buổi sáng với luồng nội dung sau:
        1. Chào buổi sáng thật bùng nổ, thông báo giờ giấc và ngày tháng.
        2. Cập nhật thời tiết hiện tại, tình hình mưa gió và chỉ số AQI. Dựa vào đó, đưa ra lời khuyên "lầy lội" về trang phục hoặc sức khỏe (ví dụ: trời mưa thì dặn mang áo mưa kẻo ướt, AQI cao thì nhắc đeo khẩu trang Ninja).
        3. Phân tích mục "Sự kiện". Nếu có sự kiện (khác None/Null/Trống), hãy nhắc nhở thật duyên dáng. Nếu không có sự kiện, tuyệt đối bỏ qua và không nhắc đến việc "không có sự kiện".
        4. Cung cấp nhiệt độ cao nhất - thấp nhất và điều kiện thời tiết, độ ẩm, khả năng mưa trong ngày hôm nay tại Hà Nội. Tiếp theo, cung cấp nhiệt độ cao nhất - thấp nhất và điều kiện thời tiết, độ ẩm, khả năng mưa của ngày mai tại Hà Nội dựa trên dữ liệu dự báo (nếu thiếu dữ liệu, nói rõ chưa có dữ liệu; không tự tạo số liệu).
        -----------------
        Nhiệm vụ của bạn là tổng hợp dữ liệu trên thành một thông báo chúc ngủ ngon với luồng nội dung sau:
        1. Gửi lời chúc ngủ ngon ấm áp, thư giãn nhưng vẫn giữ nét lầy lội, dễ thương (có thể nhắc tên Sóc và Chíp nếu muốn). Thông báo giờ giấc hiện tại để nhắc nhở mọi người đến lúc lên giường.
        2. Cập nhật nhanh thời tiết và chất lượng không khí (AQI) đêm nay. Dựa vào đó, đưa ra lời khuyên vui nhộn cho giấc ngủ (ví dụ: trời lạnh thì nhắc cuộn tròn như kimbap, trời mưa thì bảo thời tiết này đắp chăn ngủ là nhức nách, AQI cao thì nhắc đóng kín cửa sổ phòng).
        3. Phân tích mục "Sự kiện". Nếu có sự kiện lễ tết (khác None/Null/Trống), hãy nhắc nhở nhẹ nhàng để chuẩn bị tinh thần cho ngày mai. Nếu không có sự kiện, TUYỆT ĐỐI BỎ QUA và không nhắc đến việc "không có sự kiện".
        4. Báo cáo nhanh dự báo thời tiết ngày mai tại Hà Nội (nhiệt độ cao nhất - thấp nhất, điều kiện thời tiết, độ ẩm, khả năng mưa) để mọi người biết đường soạn sẵn quần áo. Nếu thiếu dữ liệu, nói rõ chưa có dữ liệu; không tự tạo số liệu.
        -----------------
        Hãy đóng vai một người bạn vui nhộn, tràn đầy năng lượng để đánh thức hai bé Sóc và Chíp dậy chuẩn bị đi học. Dựa vào dữ liệu đầu vào, hãy tạo một thông báo chào buổi sáng tuân thủ các bước sau:
        1. Chào hỏi rộn ràng, gọi tên Sóc và Chíp, kèm thông báo giờ giấc, ngày tháng (Dương lịch và Âm lịch).
        2. Cập nhật nhanh thời tiết hiện tại (mưa/nắng, chất lượng không khí AQI). Từ đó đưa ra lời khuyên hài hước, dễ thương cho các bé về việc chọn quần áo, mang theo vật dụng (áo mưa, ô, khẩu trang Ninja...) và giữ gìn sức khỏe khi ra khỏi nhà.
        3. Cung cấp thông tin nhiệt độ cao nhất và thấp nhất trong ngày hôm nay tại Hà Nội.
        4. Kiểm tra mục "Sự kiện": Nếu có sự kiện lễ tết, hãy nhắc nhở một cách háo hức. Nếu sự kiện trống, None, hoặc Null, TUYỆT ĐỐI BỎ QUA, không được nhắc đến cụm từ "không có sự kiện".
      selector:
        template:

    message_if_ai_error:
      name: 📝 Message If AI Error
      description: |
        👉 Nội dung thông báo sẽ sử dụng nếu AI bị lỗi.
        ⚠️ Tránh bị mất thông báo nếu AI lỗi.
        ⚠️ Sửa nội dung mặc định theo nội dung bạn muốn.
      default: >
        Nhắc nhở Sóc Chíp đi ngủ
      selector:
        template:

    template_customs:
      name: 🧩 Custom Template
      description: |
        👉 Sử dụng để chèn một `template mẫu` để tùy biến thêm dữ liệu trong Automation này
        ✅ Sử dụng `{{ template_customs }}` để lấy dữ liệu từ đây cho các nội dung trong automation
        ⚠️ Để trống nếu không sử dụng
        🌐 Tham khảo về mẫu: https://www.home-assistant.io/docs/configuration/templating/
      default: ""
      selector:
        template:

    message_customs:
      name: 🪧 Custom Message
      description: |
        👉 Nội dung tin nhắn custom dùng cho gửi thông báo Zalo, Telegram, Discord
        ⚠️ Bật AI hoặc Không dùng bỏ trống
      default: ""
      selector:
        template:

    repeat_settings:
      name: "Repeat Settings"
      icon: mdi:repeat-variant
      collapsed: true
      input:
        repeat_types:
          name: ✅ Repeat Option (Optional)
          description: |
            👉 Enable loại Vòng Lặp nếu muốn lặp gửi thông báo
            ⚠️ Chọn loại nào thì nhập điều kiện tương ứng bên dưới
            🌐 Tham khảo thêm: https://www.home-assistant.io/docs/scripts/#repeat-a-group-of-actions
          default: disable_repeat
          selector:
            select:
              options:
                - label: Disable Repeat
                  value: "disable_repeat"
                - label: Count
                  value: "count_repeat"
                - label: Until
                  value: "until_repeat"
                - label: While
                  value: "while_repeat"
                - label: For each
                  value: "for_each_repeat"
        repeat_count:
          name: 🔢 Count
          description: |
            👉 Lặp lại hành động n lần
            🌐 Tham khảo thêm: https://www.home-assistant.io/docs/scripts/#counted-repeat
          selector:
            number:
              min: 1
              max: 20
              step: 1
              unit_of_measurement: count
          default: 5
        repeat_until:
          name: ♻️ Until
          description: |
            👉 Lặp lại hành động trừ khi điều kiện là đúng
            🌐 Tham khảo thêm: https://www.home-assistant.io/docs/scripts/#repeat-until
          default: []
          selector:
            condition:
        repeat_while:
          name: 🔚 While
          description: |
            👉 Lặp lại hành động trong khi điều kiện là đúng
            🌐 Tham khảo thêm: https://www.home-assistant.io/docs/scripts/#while-loop
          default: []
          selector:
            condition:
        repeat_for_each:
          name: 🔁 For Each
          description: |
            👉 Lặp lại hành động với mỗi phần tử
            🌐 Tham khảo thêm: https://www.home-assistant.io/docs/scripts/#for-each
          default: []
          selector:
            object: {}
        repeat_limit:
          name: 🛑 Giới hạn vòng lặp While / Until
          description: Giới hạn số lượt gửi trong một lần chạy, tránh vòng lặp vô hạn khi điều kiện không thay đổi.
          default: 100
          selector:
            number:
              min: 1
              max: 10000
              step: 1
              mode: box
        repeat_delay:
          name: ⌛ Delay
          description: |
            👉 Thời gian trễ sau mỗi lần lặp lại hành động (tính theo giây)
            ⚠️ Tránh lặp lại hành động quá nhanh hệ thống không phản hồi kịp
            ⚠️ Mặc định delay 1 phút (60s)
          selector:
            number:
              min: 0
              max: 3600
              step: 5
              unit_of_measurement: seconds
          default: 60

    ai_task_settings:
      name: "AI Task Settings"
      icon: mdi:robot-happy-outline
      collapsed: true
      input:
        ai_powered:
          name: ✅ AI Task (Optional)
          description: |
            👉 Sử dụng AI để thay đổi ngẫu nhiên nội dung mỗi lần gửi thông báo.
            🌐 Tham khảo thêm tại: https://www.home-assistant.io/integrations/ai_task/
          default: false
          selector:
            boolean: {}
        ai_task_entity_id:
          name: 🤖 Entity ID of AI Task
          description: |
            👉 Chọn AI sủ dụng cho việc tạo nội dung.
            ⚠️ Nếu không Bật sử dụng AI bên trên không cần chọn
          selector:
            entity:
              filter:
                domain: ai_task
          default: ""
        ai_task_name:
          name: 📝 Task Name
          description: |
            👉 Nhập Tiêu đề cho Task
          default: >
            Thông báo
          selector:
            text:
              multiline: false
        ai_instructions:
          name: ✍️ Instructions
          description: |
            👉 Chuỗi chứa các hướng dẫn cụ thể để AI tuân theo khi tạo văn bản.
            ⚠️ Tùy theo sự sáng tạo và yêu cầu bạn muốn để có thể thay đổi các hướng dẫn mẫu sẵn có.
            ⚠️ Hãy thay đỗi dữ liệu các sensor theo của bạn để sử dụng cho Automation
          default: |
            Dưới đây là thông tin đầu vào từ hệ thống nhà thông minh:
            - Thời gian: {{now().hour}}h {{now().minute}}
            - Hôm nay: {{states('sensor.doc_thu')}}, {{states('sensor.doc_ngay_duong_lich')}} (Âm lịch: {{states('sensor.doc_ngay_am_lich')}})
            - Sự kiện: {{state_attr('sensor.am_lich_hang_ngay','solar_holiday')}} / {{state_attr('sensor.am_lich_hang_ngay','lunar_holiday')}}
            - Thời tiết hiện tại: {{states('sensor.thoi_tiet_hien_tai')}}, Trạng thái mưa: {{states('binary_sensor.cam_bien_mua')}}, 
            - Chất lượng không khí (AQI): {{states('sensor.chinese_air_quality_index')}}
            - Dự báo (PirateWeather): {{states('weather.pirateweather')}}
            - Thời tiết hôm nay: điều kiện {{ state_attr('sensor.du_bao_thoi_tiet_thong_minh', 'hom_nay_condition') }}, thấp nhất {{ state_attr('sensor.du_bao_thoi_tiet_thong_minh', 'hom_nay_templow') }}, cao nhất {{ state_attr('sensor.du_bao_thoi_tiet_thong_minh', 'hom_nay_temperature') }}, khả năng mưa {{ state_attr('sensor.du_bao_thoi_tiet_thong_minh', 'hom_nay_precipitation_probability') }}, độ ẩm {{ state_attr('sensor.du_bao_thoi_tiet_thong_minh', 'hom_nay_humidity') }}. 
            - Thời tiết ngày mai: điều kiện {{ state_attr('sensor.du_bao_thoi_tiet_thong_minh', 'ngay_mai_condition') }}, thấp nhất {{ state_attr('sensor.du_bao_thoi_tiet_thong_minh', 'ngay_mai_templow') }}, cao nhất {{ state_attr('sensor.du_bao_thoi_tiet_thong_minh', 'ngay_mai_temperature') }}, khả năng mưa {{ state_attr('sensor.du_bao_thoi_tiet_thong_minh', 'ngay_mai_precipitation_probability') }}, độ ẩm {{ state_attr('sensor.du_bao_thoi_tiet_thong_minh', 'ngay_mai_humidity') }}.
            Quy tắc TỐI THƯỢNG khi trả lời:
            1. Đóng vai một trợ lý ảo hài hước và tràn đầy năng lượng.
            2. Dùng 100% Tiếng Việt. Dùng dấu phẩy hoặc chấm để ngắt câu hợp lý đúng ngữ pháp.
            3. TUYỆT ĐỐI gom tất cả nội dung thành MỘT DÒNG DUY NHẤT.
            4. Ngắn gọn, súc tích, nhịp điệu nhanh để đọc qua loa hoặc thông báo điện thoại.
            5. Không bịa dữ liệu thời tiết, thời gian hoặc trạng thái thiết bị. Nếu dữ liệu là unknown, unavailable, None hoặc thiếu, nói rõ chưa có dữ liệu hoặc bỏ qua mục đó.
          selector:
            template:


    device_notify_settings:
      name: "Mobile App Notify"
      icon: mdi:devices
      collapsed: true
      input:
        include_notify:
          name: ✅ Use The Mobile App Notify Option (Optional)
          description: |
            👉 Enable nếu muốn gửi thông báo lên điện thoại đã chọn bên dưới.
            🌐 Xem thêm tại https://companion.home-assistant.io/docs/notifications/notifications-basic
          default: false
          selector:
            boolean: {}

        is_ios_android:
          name: 🔔 Android or iOS device?
          description: |
            👉 Chọn điện thoại đẩy thông báo là Android hay iOS?
          default: android_device
          selector:
            select:
              options:
                - label: Android
                  value: "android_device"
                - label: iOS
                  value: "ios_device"
        notify_device:
          name: 📱 Devices Notified
          description: |
            👉 Chọn Điện thoại muốn thông bảo đẩy lên.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true
        notify_title:
          name: 📝 Title
          description: |
            👉 Nhập Title của Thông báo.
            ⚠️ Có thẻ dùng CSS HTML để thiết lập màu sắc, In đậm,... cho nội dung
          default: >
            📢 <b><span style="color: red">Thông báo</span></b>
          selector:
            text:
        tap_navigate:
          name: 📲 Tap Navigate
          description: |
            ⚠️ Mở Home Assistant và đi đến vị trí bên dưới khi Thông báo được mở.
            ⚠️ Ví dụ: /lovelace/cameras.
          default: /lovelace
          selector:
            text:
              multiline: false
              multiple: false
        status_bar_icon:
          name: "🌠 Status Bar Icon"
          description: |
            `Dành cho Android`
            👉 Thiết lập icon cho thông báo trên Status Bar điện thoại
            🌐 Tìm icon tại https://pictogrammers.com/library/mdi/
          default: mdi:motion-sensor
          selector:
            icon:
              placeholder: mdi:motion-sensor
        notification_color:
          name: "🎨 Notification Color"
          description: |
            `Dành cho Android`
            👉 Thiết lập màu cho icon thông báo trên Status Bar điện thoại
          default: [255, 0, 0]
          selector:
            color_rgb:

        include_actions:
          name: ✅ Use Actions For Mobile App Notify Option (Optional)
          description: |
            👉 Enable nếu muốn có Actions trong thông báo lên điện thoại đã chọn.
            🌐 Xem thêm tại https://companion.home-assistant.io/docs/notifications/actionable-notifications
          default: false
          selector:
            boolean: {}
        confirm_text:
          name: 📝 Confirmation Text
          description: "Text to show on the confirmation button"
          default: "✅ Confirm"
          selector:
            text:
        confirm_action:
          name: 👇 Confirmation Action
          description: "Action to run when notification is confirmed"
          default: []
          selector:
            action:
        dismiss_text:
          name: 📝 Dismiss Text
          description: "Text to show on the dismiss button"
          default: "❌ Dismiss"
          selector:
            text:
        enable_custom_dismiss_action:
          name: ✅ Enable Custom Dismiss Action
          description: "Bật để chạy Custom Dismiss Action khi bấm Dismiss; tắt để xóa thông báo."
          default: false
          selector:
            boolean: {}
        custom_dismiss_action:
          name: 👇 Custom Dismiss Action
          description: "Action to run when notification is dismissed"
          default: []
          selector:
            action:
        tag:
          name: "\U0001F516 Tag"
          description: |
            👉 Tiền tố định danh thông báo. Blueprint thêm context ID để các lượt chạy không xóa nhầm thông báo của nhau.
            ⚠️ Trong Custom Actions, dùng `{{ notification_tag }}` nếu cần xóa đúng thông báo của lượt này.
            🌐 Tham khảo thêm: https://companion.home-assistant.io/docs/notifications/actionable-notifications
          default: "dimiss_notifications_now"
          selector:
            text: {}
        timeout:
          name: ⌛️ Timeout Duration
          description: |
            👉 Thời gian chờ người dùng bấm nút. Hết hạn thì tiếp tục, không tự chạy Confirm hoặc Dismiss.
            ⚠️ Khuyến nghị: tối thiểu 1 phút để đảm bảo thông báo được gửi đi.
            ⚠️ Mặc định: 10 phút.
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration:
              enable_day: false


    zalo_settings:
      name: "Zalo Settings"
      icon: mdi:message-image-outline
      collapsed: true
      input:
        include_zalo_notify:
          name: ✅ Zalo Option (Optional)
          description: |
            👉 Enable nếu muốn gửi thông báo lên Zalo.
            🌐 Xem thêm tại https://github.com/smarthomeblack/zalo_bot
          default: false
          selector:
            boolean: {}

        include_zalo_ttl:
          name: ⏱️ Bật hẹn thu hồi tin Zalo (TTL)
          description: |
            👉 Bật để truyền thời gian TTL cho tin Zalo gửi trong lượt này.
            👉 Tắt: không truyền trường `ttl`, giữ cách gửi cũ.
            ⚠️ Cần phiên bản Zalo Bot hỗ trợ TTL dạng `1m`, `1h` như giao diện tích hợp.
            ⚠️ Đây là lịch thu hồi do máy chủ Zalo Bot xử lý; không phải tự xóa cả cuộc trò chuyện.
            ⚠️ Thu hồi phụ thuộc máy chủ và ID tin nhắn trả về, không bảo đảm thành công mọi lần.
          default: false
          selector:
            boolean: {}
        zalo_ttl:
          name: ⌛ Thời gian thu hồi Zalo
          description: |
            👉 Chỉ áp dụng khi bật TTL bên trên; dùng chung cho các tin Zalo của automation.
            👉 Bản camera áp dụng cho cả tin ảnh và tin video.
            ⚠️ `1h` được giữ nguyên để tích hợp xử lý mốc chạy trước 1 phút như trong giao diện.
          default: "1h"
          selector:
            select:
              mode: dropdown
              options:
                - label: Không hẹn thu hồi
                  value: "0"
                - label: 1 phút
                  value: "1m"
                - label: 5 phút
                  value: "5m"
                - label: 10 phút
                  value: "10m"
                - label: 15 phút
                  value: "15m"
                - label: 30 phút
                  value: "30m"
                - label: 45 phút
                  value: "45m"
                - label: 59 phút
                  value: "59m"
                - label: 1 giờ (chạy trước 1 phút)
                  value: "1h"

        zalo_group_id:
          name: ‍🆔 User or Group ID
          description: |
            👉 ID của User hoặc Group Zalo.
            ⚠️ Zalo Type bên dưới chọn User thì ở đây chỉ nhập ID của User
            ⚠️ Zalo Type bên dưới chọn Group thì ở đây chỉ nhập ID của Group
            ⚠️ Không thể sử dụng cùng lúc ID của User và ID của Group.
            ✅ Chỉ nhập 1 loại là ID User hoặc ID Group
          selector:
            text:
              multiple: true
          default: []

        zalo_phone:
          name: 📞 Zalo Acc
          description: 👉 Số điện thoại của Zalo Bot.
          selector:
            text:
          default: "+84376861184"

        zalo_types:
          name: 👨‍👩‍👧‍👦 Zalo Type Option (Optional)
          description: |
            👉 Chọn thông báo lên Zalo cá nhân hoặc group.
            ⚠️ Chọn User thì ở `User or Group ID` chỉ nhập ID của User
            ⚠️ Chọn Group thì ở `User or Group ID` chỉ nhập ID của Group
            ⚠️ Không thể sử dụng cùng lúc ID của User và ID của Group.
            ✅ `User or Group ID` chỉ nhập 1 loại là ID User hoặc ID Group
          default: "1"
          selector:
            select:
              options:
                - label: User
                  value: "0"
                - label: Group
                  value: "1"
        zalo_login_check:
          name: 📱 Zalo Login
          description: |
            👉 Chọn Zalo Login để check lỗi nếu có
          default: ""
          selector:
            entity:
              filter:
                - integration: zalo_bot
                  domain: binary_sensor
                  device_class: connectivity
              multiple: false
        is_ios_android_zalo:
          name: 🔔 Android or iOS device Zalo Error?
          description: |
            👉 Chọn điện thoại đẩy thông báo là Android hay iOS?
          default: android_device_zalo_error
          selector:
            select:
              options:
                - label: Android
                  value: "android_device_zalo_error"
                - label: iOS
                  value: "ios_device_zalo_error"
        notify_device_zalo:
          name: 📱 Devices Notify Zalo Error
          description: |
            👉 Chọn Điện thoại muốn thông bảo đẩy lên khi zalo lỗi
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true

    telegram_settings:
      name: "Telegram Settings"
      icon: mdi:message-badge
      collapsed: true
      input:
        include_telegram_notify:
          name: ✅ Telegram Option (Optional)
          description: |
            👉 Enable nếu muốn gửi thông báo lên Telegram.
            🌐 Xem thêm tại https://www.home-assistant.io/integrations/?search=telegram
          default: false
          selector:
            boolean: {}

        notify_tele_target:
          name: 📱 Notification targets
          description: |
            👉 Chọn bot muốn thông bảo đẩy lên.
          default: []
          selector:
            entity:
              filter:
                - domain: notify
                  integration: telegram_bot
              multiple: true

        telegram_parse_mode:
          name: 📝 Định dạng Telegram
          description: HTML giữ cách hiển thị cũ. Chọn plain_text nếu nội dung AI hoặc ký tự đặc biệt gây lỗi định dạng
            Telegram.
          default: html
          selector:
            select:
              options:
              - html
              - plain_text
              - markdown
              - markdownv2
        telegram_topic:
          name: 🆔 Topic ID
          description: |
            👉 ID của chủ đề trong nhóm Telegram.
            ⚠️ Để trống nếu không gửi vào topic. Khi chọn nhiều đích, Topic ID này áp dụng cho từng đích.
          selector:
            text:
          default: ""
            
    discord_settings:
      name: "Discord Settings"
      icon: mdi:message-bulleted
      collapsed: true
      input:
        include_discord_notify:
          name: ✅ Discord Option (Optional)
          description: |
            👉 Enable nếu muốn gửi thông báo lên Discord.
            🌐 Xem thêm tại https://www.home-assistant.io/integrations/discord/
          default: false
          selector:
            boolean: {}
        discord_provider:
          name: 🛠️ Discord Notify Service
          description: |
            👉 Nhập tên dịch vụ notify của Discord, ví dụ `hass_discord` hoặc `notify.hass_discord`.
            ⚠️ Đây là tên action, không phải config entry ID.
          selector:
            text:
              multiline: false
          default: "hass_discord"
        discord_channel:
          name: 🆔 Discord Channel ID
          description: 👉 ID của Channel trong nhóm Discord.
          selector:
            text:
              multiple: true
          default: []

    tts_notify_settings:
      name: TTS To Speakers Settings
      icon: mdi:speaker-message
      collapsed: true
      input:
        include_tts_announcement:
          name: ✅ Use The Text-to-Speech Announcement Option (Optional)
          description: |
            👉 Enable khi muốn gửi TTS ra loa sẽ chọn bên dưới.
            🌐 Xem thêm tại https://www.home-assistant.io/integrations/?search=tts
          default: false
          selector:
            boolean: {}
        num_volume_speaker:
          name: 🔊 Volume Set
          description: 👉 Thiết lập Âm lượng cho Loa. ( từ 0.1 đến 1)
          selector:
            number:
              min: 0.1
              max: 1
              step: 0.1
          default: 1
        text_to_speech_engine:
          name: 🗣️ Text-to-Speech Service Provider
          description: |
            👉 Chọn dịch vụ TTS hỗ trợ.
          default: ""
          selector:
            entity:
              filter:
                domain: tts
        tts_cache_mode:
          name: 💾 TTS Cache
          description: |
            👉 Bật để truyền `cache: true`, tắt để truyền `cache: false`.
            ⚠️ Mặc định bật, giống mặc định của `tts.speak`.
          default: true
          selector:
            boolean: {}
        tts_language:
          name: 🌐 TTS Language (Optional)
          description: |
            👉 Nhập mã ngôn ngữ mà dịch vụ TTS hỗ trợ, ví dụ `vi`.
            ⚠️ Để trống: không truyền `language`, sử dụng mặc định của dịch vụ TTS.
          default: ""
          selector:
            text:
              multiline: false
        tts_voice:
          name: 🗣️ TTS Voice (Optional)
          description: |
            👉 Nhập tên giọng đọc mà dịch vụ TTS hỗ trợ, ví dụ `maichi`.
            ⚠️ Có giá trị: truyền vào `options.voice`.
            ⚠️ Để trống: không truyền `options`, sử dụng giọng đọc mặc định của dịch vụ TTS.
          default: ""
          selector:
            text:
              multiline: false
        tts_restore_volume:
          name: 🔊 Khôi phục âm lượng sau TTS
          description: Chờ phát xong rồi trả lại âm lượng cũ. Không thay đổi nếu người dùng đã chỉnh sang mức khác. Thiết
            bị phải báo trạng thái phát chính xác.
          default: true
          selector:
            boolean: {}
        tts_busy_timeout:
          name: ⌛ Chờ loa đang bận (giây)
          description: Chờ loa hết playing/buffering. Hết thời gian chỉ phát trên loa đang rảnh; không cắt ngang loa vẫn
            bận.
          default: 60
          selector:
            number:
              min: 0
              max: 600
              step: 1
              mode: box
        tts_start_timeout:
          name: ⌛ Chờ loa báo bắt đầu phát (giây)
          description: Thời gian đợi mỗi loa báo thay đổi trạng thái sau khi gửi TTS.
          default: 15
          selector:
            number:
              min: 1
              max: 120
              step: 1
              mode: box
        tts_playback_timeout:
          name: ⌛ Giới hạn theo dõi lượt phát (giây)
          description: Ngân sách chờ chung cho các loa sau khi gửi TTS. Tăng nếu nội dung đọc dài. Hết hạn vẫn thử khôi
            phục âm lượng; không dừng nhạc cưỡng bức.
          default: 180
          selector:
            number:
              min: 10
              max: 1800
              step: 1
              mode: box
        media_player:
          name: 🎶 Media Player
          description: |
            👉 Chọn loa để phát thông báo
          default: []
          selector:
            entity:
              filter:
                domain: media_player
              multiple: true
        include_custom_media_player:
          name: ✅ Use Custom Media Player Option (Optional)
          description: |
            👉 Enable khi muốn thêm Media Player custom dạng sensor
            ⚠️ Sử dụng các cảm biến hiện diện hoặc tùy ý để phát hiện phòng nào đang có người để phát loa.
          default: false
          selector:
            boolean: {}
        custom_media_player:
          name: 🎶 Custom Media Player
          description: |
            👉 Nhập Sensor đã có với state là các loa.
            ⚠️ Sensor có thể tạo trong `Helpers` hoặc `template sensor` trong config trong Home assistant 
            <details>
            <summary><b>Ví dụ sensor mẫu:</b> - Nhấn để mở rộng</summary>
              
              ```yaml
              {% set listspeaker =
                [
                  {'room':'binary_sensor.status_bep', 'speaker':'media_player.phong_bep_speaker'},
                  {'room':'binary_sensor.pk_status', 'speaker':'media_player.pk_google_speaker'},
                  {'room':'binary_sensor.pn_status', 'speaker':'media_player.phong_ngu_speaker'},
                  {'room':'binary_sensor.ph_status', 'speaker':'media_player.ph_google_speaker'}
                ]
              %}
              {% set listspeaker1 =
                [
                  'binary_sensor.status_bep',
                  'binary_sensor.pn_status',
                  'binary_sensor.pk_status',
                  'binary_sensor.ph_status'
                ] | select('is_state','on') | list
              %}
              {% set to_add = listspeaker
                | selectattr('room', 'in', listspeaker1)
                | map(attribute='speaker')
                | list
              %}
              {{ to_add | to_json }}
              ```
            </details>
          default: ""
          selector:
            template:

    tts_to_mobile_settings:
      name: TTS To Mobile Settings
      icon: mdi:speaker-message
      collapsed: true
      input:
        include_tts_to_mobile:
          name: ✅ Use The Mobile App TTS Option (Optional)
          description: |
            👉 Bật để đọc thông báo trên điện thoại Android có ứng dụng Home Assistant Companion.
            ⚠️ Phần này dùng bộ đọc của Android, độc lập với dịch vụ, cache và giọng TTS của loa bên trên.
            🌐 Xem thêm tại https://companion.home-assistant.io/docs/notifications/notifications-basic/#text-to-speech-notifications
          default: false
          selector:
            boolean: {}
        tts_to_mobile_media_stream_types:
          name: ✅ TTS Media Stream Option (Optional)
          description: |
            👉 Enable kiểu media_stream muốn TTS ra điện thoại
            ⚠️ tts: Phát TTS phụ thuộc âm lượng điện thoại
            ⚠️ alarm_stream: Phát TTS với âm lượng trung bình kể cả khi âm lượng là 0
            ⚠️ alarm_stream_max: Phát TTS max loa ngoài kể cả khi âm lượng là 0
            🌐 Xem thêm tại https://companion.home-assistant.io/docs/notifications/notifications-basic/#text-to-speech-notifications
          default: alarm_stream_max
          selector:
            select:
              options:
                - label: TTS
                  value: "TTS Normal"
                - label: Alarm Stream
                  value: "alarm_stream"
                - label: Alarm Stream Max
                  value: "alarm_stream_max"
        tts_to_mobile:
          name: 🗣️ TTS To Mobiles
          description: |
            👉 Chọn Điện thoại muốn thông báo đọc ra loa của điện thoại.
            🌐 Xem thêm tại https://companion.home-assistant.io/docs/notifications/notifications-basic/#text-to-speech-notifications
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true

    custom_actions_settings:
      name: "Custom Actions 2"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        include_custom_actions:
          name: ✅ Use The Custom Action Options (Optional)
          description: |
            👉 Chọn Enable Custom Actions và thêm Actions bên dưới nếu bạn muốn thêm các Hành động khác để thực hiện trong Automation này.
          default: false
          selector:
            boolean: {}
        custom_actions:
          name: 🛠️ Custom Actions
          description: |
            🚨 Action này sẽ chạy cuối cùng trong Automation.
            👉 Sử dụng cho việc muốn chạy Action gì đó sau khi thông báo hoàn tất.
            ⚠️ Biến lấy nội dung phân tích AI cho các nội dung khác: `response_thong_bao.data.thong_bao`
          default: []
          selector:
            action:

    execution_settings:
      name: Execution Settings
      icon: mdi:playlist-play
      collapsed: true
      input:
        execution_mode:
          name: ⚙️ Khi automation được kích hoạt nhiều lần
          description: Queued chạy lần lượt trong cùng automation, tránh giành loa. Parallel gửi ngay nhưng các lượt
            có thể tranh loa. Single bỏ qua kích hoạt mới khi đang chạy. Queued có thể phải đợi hết thời gian chờ nút
            thông báo.
          default: queued
          selector:
            select:
              options:
              - label: Queued — xếp hàng
                value: queued
              - label: Parallel — chạy đồng thời
                value: parallel
              - label: Single — chỉ một lượt
                value: single

# Runtime: dùng chung một chu trình cho cả 5 chế độ lặp.
triggers: !input 'global_triggers'
variables:
  include_zalo_ttl: !input include_zalo_ttl
  zalo_ttl: !input zalo_ttl
  zalo_optional_data: >-
    {{ dict(ttl=(0 if zalo_ttl | string == '0' else zalo_ttl | string)) if include_zalo_ttl else dict() }}
  template_customs: !input 'template_customs'
  include_custom_1_actions: !input 'include_custom_1_actions'
  repeat_types: !input 'repeat_types'
  repeat_count: !input 'repeat_count'
  repeat_for_each: !input 'repeat_for_each'
  repeat_delay: !input 'repeat_delay'
  ai_powered: !input 'ai_powered'
  ai_task_entity_id: !input 'ai_task_entity_id'
  ai_task_name: !input 'ai_task_name'
  include_notify: !input 'include_notify'
  notify_device: !input 'notify_device'
  notify_title: !input 'notify_title'
  tap_navigate: !input 'tap_navigate'
  filtered_devices: |-
    {% set raw = notify_device | default([], true) %}
    {% set items = [raw] if raw is string or raw is number else (raw if raw is sequence and raw is not mapping else []) %}
    {{ items | select('string') | map('trim') | reject('equalto', '') | unique | list }}
  is_ios_android: !input 'is_ios_android'
  include_actions: !input 'include_actions'
  confirm_text: !input 'confirm_text'
  dismiss_text: !input 'dismiss_text'
  timeout: !input 'timeout'
  enable_custom_dismiss_action: !input 'enable_custom_dismiss_action'
  tag: !input 'tag'
  include_zalo_notify: !input 'include_zalo_notify'
  zalo_group_id: !input 'zalo_group_id'
  zalo_login_check: !input 'zalo_login_check'
  is_ios_android_zalo: !input 'is_ios_android_zalo'
  notify_device_zalo: !input 'notify_device_zalo'
  include_telegram_notify: !input 'include_telegram_notify'
  notify_tele_target: !input 'notify_tele_target'
  telegram_topic: !input 'telegram_topic'
  include_discord_notify: !input 'include_discord_notify'
  discord_provider: !input 'discord_provider'
  discord_channel: !input 'discord_channel'
  include_tts_announcement: !input 'include_tts_announcement'
  num_volume_speaker: !input 'num_volume_speaker'
  text_to_speech_engine: !input 'text_to_speech_engine'
  tts_cache_mode: !input 'tts_cache_mode'
  tts_language: !input 'tts_language'
  tts_voice: !input 'tts_voice'
  media_player: !input 'media_player'
  include_custom_media_player: !input 'include_custom_media_player'
  include_tts_to_mobile: !input 'include_tts_to_mobile'
  tts_to_mobile: !input 'tts_to_mobile'
  tts_to_mobile_media_stream_types: !input 'tts_to_mobile_media_stream_types'
  filtered_tts_to_mobile: |-
    {% set raw = tts_to_mobile | default([], true) %}
    {% set items = [raw] if raw is string or raw is number else (raw if raw is sequence and raw is not mapping else []) %}
    {{ items | select('string') | map('trim') | reject('equalto', '') | unique | list }}
  include_custom_actions: !input 'include_custom_actions'
  response_thong_bao: {}
  ai_success: false
  final_text: ''
  final_tts: ''
  tts_restore_volume: !input 'tts_restore_volume'
  tts_busy_timeout: !input 'tts_busy_timeout'
  tts_start_timeout: !input 'tts_start_timeout'
  tts_playback_timeout: !input 'tts_playback_timeout'
  repeat_limit: !input 'repeat_limit'
  telegram_parse_mode: !input 'telegram_parse_mode'
  notification_color: !input 'notification_color'
  status_bar_icon: !input 'status_bar_icon'
  zalo_phone: !input 'zalo_phone'
  zalo_types: !input 'zalo_types'
  filtered_notify_device_zalo: |-
    {% set raw = notify_device_zalo | default([], true) %}
    {% set items = [raw] if raw is string or raw is number else (raw if raw is sequence and raw is not mapping else []) %}
    {{ items | select('string') | map('trim') | reject('equalto', '') | unique | list }}
  filtered_telegram_target: |-
    {% set raw = notify_tele_target | default([], true) %}
    {% set items = [raw] if raw is string or raw is number else (raw if raw is sequence and raw is not mapping else []) %}
    {{ items | select('string') | map('trim') | reject('equalto', '') | unique | list }}
  filtered_zalo_id: |-
    {% set raw = zalo_group_id | default([], true) %}
    {% set items = [raw] if raw is string or raw is number else (raw if raw is sequence and raw is not mapping else []) %}
    {{ items | reject('equalto', none) | map('string') | map('trim') | reject('equalto', '') | unique | list }}
  filtered_discord_id: |-
    {% set raw = discord_channel | default([], true) %}
    {% set items = [raw] if raw is string or raw is number else (raw if raw is sequence and raw is not mapping else []) %}
    {{ items | reject('equalto', none) | map('string') | map('trim') | reject('equalto', '') | unique | list }}
  notification_color_hex: '#{{ ''%02x%02x%02x'' | format(notification_color[0] | int, notification_color[1] | int,
    notification_color[2] | int) }}'
  tts_optional_data: |-
    {% set params = dict(cache=(tts_cache_mode in [true, 'default', 'enabled', 'true', 'on'])) %}
    {% set language = tts_language | default('', true) | string | trim %}
    {% if language %}{% set params = dict(params, language=language) %}{% endif %}
    {% set voice = tts_voice | default('', true) | string | trim %}
    {% if voice %}{% set params = dict(params, options=dict(voice=voice)) %}{% endif %}
    {{ params }}
conditions: !input 'global_conditions'
actions:
- if:
  - condition: template
    value_template: '{{ include_custom_1_actions }}'
  then: !input 'custom_actions_1'
- choose:
  - conditions: '{{ repeat_types == ''count_repeat'' }}'
    sequence:
    - repeat:
        count: '{{ repeat_count | int(1) }}'
        sequence:
        - &notification_cycle
          sequence:
          - variables:
              template_customs: !input 'template_customs'
              ai_structure_description: !input 'ai_structure_description'
              message_customs: !input 'message_customs'
              message_if_ai_error: !input 'message_if_ai_error'
              response_thong_bao: {}
              ai_success: false
              notification_cycle_id: '{{ context.id ~ ''_'' ~ now().strftime(''%Y%m%d%H%M%S%f'') }}'
              action_confirm: '{{ ''CONFIRM_'' ~ notification_cycle_id }}'
              action_dismiss: '{{ ''DISMISS_'' ~ notification_cycle_id }}'
              notification_tag: '{{ (tag | default(''notification'', true)) ~ ''_'' ~ context.id }}'
              tele_title: '{{ notify_title | regex_replace(''<span[^>]*>'', '''') | replace(''</span>'', '''') }}'
              is_message_customs: '{{ ai_structure_description if message_customs | default('''', true) | string
                | trim == '''' else message_customs }}'
              ai_notification_error: 🚨 {{ message_if_ai_error }}{{'\n'}}🚨 AI đang lỗi.{{'\n\n'}}🕒 {{ now().strftime('%H:%M:%S
                %a, %d-%b-%Y') }}
              ai_notification_tts_error: '{{ message_if_ai_error }}. AI đang lỗi.'
              final_text: 👉 {{ is_message_customs }}{{'\n'}}🕒 {{ now().strftime('%H:%M:%S %a, %d-%b-%Y') }}
              final_tts: '{{ ai_structure_description }}'
            alias: Làm mới dữ liệu và xóa phản hồi của lượt trước
          - if:
            - condition: template
              value_template: '{{ ai_powered }}'
            then:
            - variables:
                ai_instructions: !input 'ai_instructions'
            - action: ai_task.generate_data
              continue_on_error: true
              data: |-
                {% set params = dict(task_name=ai_task_name, instructions=ai_instructions,
                    structure=dict(thong_bao=dict(description=ai_structure_description, required=true, selector=dict(text=dict())))) %}
                {% if ai_task_entity_id is string and ai_task_entity_id | trim %}
                  {% set params = dict(params, entity_id=ai_task_entity_id | trim) %}
                {% endif %}
                {{ params }}
              response_variable: response_thong_bao
            - variables:
                ai_success: |-
                  {{ response_thong_bao is mapping
                     and response_thong_bao.get('data') is mapping
                     and response_thong_bao['data'].get('thong_bao') is string
                     and response_thong_bao['data']['thong_bao'] | trim | length > 0 }}
                final_text: '{{ (''👉 '' ~ (response_thong_bao[''data''][''thong_bao''] | trim) ~ ''\n🕒 '' ~ now().strftime(''%H:%M:%S
                  %a, %d-%b-%Y'')) if ai_success else ai_notification_error }}'
                final_tts: '{{ response_thong_bao[''data''][''thong_bao''] | trim if ai_success else ai_notification_tts_error
                  }}'
          - alias: Gửi đồng thời qua các kênh độc lập
            parallel:
            - if:
              - condition: template
                value_template: '{{ include_notify and filtered_devices | length > 0 }}'
              then:
              - repeat:
                  for_each: '{{ filtered_devices }}'
                  sequence:
                  - action: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                    continue_on_error: true
                    data: |-
                      {% set extra = dict(url=tap_navigate) %}
                      {% if is_ios_android == 'android_device' %}
                        {% set extra = dict(extra, priority='high', ttl=0, notification_icon=status_bar_icon,
                          color=notification_color_hex, clickAction=tap_navigate) %}
                      {% endif %}
                      {% if include_actions %}
                        {% set extra = dict(extra, tag=notification_tag, actions=[
                          dict(action=action_confirm, title=confirm_text),
                          dict(action=action_dismiss, title=dismiss_text)]) %}
                      {% endif %}
                      {{ dict(title=notify_title, message=final_text, data=extra) }}
              - if:
                - condition: template
                  value_template: '{{ include_actions }}'
                then:
                - wait_for_trigger:
                  - trigger: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: '{{ action_confirm }}'
                  - trigger: event
                    event_type: mobile_app_notification_action
                    event_data:
                      action: '{{ action_dismiss }}'
                  timeout: '{{ timeout }}'
                  continue_on_timeout: true
                - choose:
                  - conditions: '{{ wait.completed and wait.trigger is not none and wait.trigger.event.data.action
                      == action_confirm }}'
                    sequence: !input 'confirm_action'
                  - conditions: '{{ wait.completed and wait.trigger is not none and wait.trigger.event.data.action
                      == action_dismiss }}'
                    sequence:
                    - if:
                      - condition: template
                        value_template: '{{ enable_custom_dismiss_action }}'
                      then: !input 'custom_dismiss_action'
                      else:
                      - repeat:
                          for_each: '{{ filtered_devices }}'
                          sequence:
                          - action: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                            continue_on_error: true
                            data:
                              message: clear_notification
                              data:
                                tag: '{{ notification_tag }}'
              alias: Mobile App — gửi và chờ nút riêng cho từng lượt
            - if:
              - condition: template
                value_template: '{{ include_zalo_notify and filtered_zalo_id | length > 0 }}'
              then:
              - variables:
                  zalo_failed: false
              - repeat:
                  for_each: '{{ filtered_zalo_id }}'
                  sequence:
                  - variables:
                      response_zalo_send_messages: {}
                  - action: zalo_bot.send_message
                    continue_on_error: true
                    data: '{{ dict(zalo_optional_data, type=zalo_types, message=''📢 Thông báo\n'' ~ final_text, thread_id=repeat.item
                      | string, account_selection=zalo_phone | string) }}'
                    response_variable: response_zalo_send_messages
                  - variables:
                      zalo_failed: |-
                        {{ zalo_failed or response_zalo_send_messages is not mapping
                           or not (response_zalo_send_messages.get('success', false) | bool(false)) }}
              - if:
                - condition: template
                  value_template: '{{ zalo_failed or (zalo_login_check is string and zalo_login_check | length >
                    0 and not is_state(zalo_login_check, ''on'')) }}'
                then:
                - repeat:
                    for_each: '{{ filtered_notify_device_zalo }}'
                    sequence:
                    - action: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                      continue_on_error: true
                      data: |-
                        {% set extra = dict(url=tap_navigate) %}
                        {% if is_ios_android_zalo == 'android_device_zalo_error' %}
                          {% set extra = dict(extra, priority='high', ttl=0, notification_icon=status_bar_icon,
                            color=notification_color_hex, clickAction=tap_navigate) %}
                        {% endif %}
                        {{ dict(title=notify_title, message=final_text, data=extra) }}
              alias: Zalo — kiểm tra phản hồi, gửi dự phòng một lần mỗi lượt
            - if:
              - condition: template
                value_template: '{{ include_telegram_notify and filtered_telegram_target | length > 0 }}'
              then:
              - repeat:
                  for_each: '{{ filtered_telegram_target }}'
                  sequence:
                  - action: telegram_bot.send_message
                    continue_on_error: true
                    data: |-
                      {% set params = dict(entity_id=repeat.item, message=final_text,
                          title=(notify_title | striptags if telegram_parse_mode == 'plain_text' else tele_title),
                          parse_mode=telegram_parse_mode) %}
                      {% if telegram_topic | int(0) > 0 %}
                        {% set params = dict(params, message_thread_id=telegram_topic | int) %}
                      {% endif %}
                      {{ params }}
              alias: Telegram — chỉ gửi Topic ID khi đã cấu hình
            - if:
              - condition: template
                value_template: '{{ include_discord_notify and filtered_discord_id | length > 0 }}'
              then:
              - repeat:
                  for_each: '{{ filtered_discord_id }}'
                  sequence:
                  - action: '{{ discord_provider | trim if (discord_provider | trim).startswith(''notify.'') else
                      ''notify.'' ~ (discord_provider | slugify) }}'
                    continue_on_error: true
                    data: '{{ dict(target=[repeat.item | string], title=notify_title, message=final_text) }}'
              alias: Discord
            - alias: TTS — phát cho các loa rảnh, theo dõi rồi khôi phục âm lượng riêng
              if:
              - condition: template
                value_template: '{{ include_tts_announcement and text_to_speech_engine is string and text_to_speech_engine
                  | length > 0 and final_tts | trim | length > 0 }}'
              then:
              - if:
                - condition: template
                  value_template: '{{ include_custom_media_player }}'
                then:
                - variables:
                    tts_raw_players: !input 'custom_media_player'
                else:
                - variables:
                    tts_raw_players: '{{ media_player }}'
              - variables:
                  tts_players: |-
                    {% set raw = tts_raw_players | default([], true) %} {% if raw is string and raw.startswith('sensor.') %}
                      {% set raw = states(raw) %}
                    {% endif %} {% if raw is string %}{% set raw = raw | from_json(raw) %}{% endif %} {% set items = raw.split(',') | map('trim') | list if raw is string else (raw if raw is sequence and raw is not mapping else []) %} {% set ids = items | select('string') | select('match', '^media_player[.]') | unique | list %} {{ expand(ids) | rejectattr('state', 'in', ['unknown', 'unavailable']) | map(attribute='entity_id') | list }}
              - if:
                - condition: template
                  value_template: '{{ tts_players | length > 0 }}'
                then:
                - wait_template: '{{ expand(tts_players) | selectattr(''state'', ''in'', [''playing'', ''buffering''])
                    | list | length == 0 }}'
                  timeout:
                    seconds: '{{ tts_busy_timeout }}'
                  continue_on_timeout: true
                - variables:
                    tts_ready: '{{ expand(tts_players) | rejectattr(''state'', ''in'', [''playing'', ''buffering'',
                      ''unknown'', ''unavailable'']) | map(attribute=''entity_id'') | list }}'
                    tts_snapshot: |-
                      {% set ns = namespace(players=[]) %} {% for entity in tts_ready %}
                        {% set ns.players = ns.players + [dict(entity_id=entity, volume=state_attr(entity, 'volume_level'))] %}
                      {% endfor %} {{ ns.players }}
                    tts_dispatch_time: '{{ as_timestamp(now()) }}'
                - if:
                  - condition: template
                    value_template: '{{ tts_ready | length < tts_players | length }}'
                  then:
                  - action: system_log.write
                    continue_on_error: true
                    data:
                      level: warning
                      logger: blueprint.ai_smart_notification
                      message: 'TTS: bỏ qua loa vẫn bận hoặc mất kết nối: {{ tts_players | reject(''in'', tts_ready)
                        | list }}'
                - repeat:
                    for_each: '{{ tts_snapshot }}'
                    sequence:
                    - if:
                      - condition: template
                        value_template: '{{ repeat.item.volume is number }}'
                      then:
                      - action: media_player.volume_set
                        continue_on_error: true
                        target:
                          entity_id: '{{ repeat.item.entity_id }}'
                        data:
                          volume_level: '{{ num_volume_speaker }}'
                    - action: tts.speak
                      continue_on_error: true
                      target:
                        entity_id: "{{ text_to_speech_engine | default('none', true) }}"
                      data: '{{ dict(tts_optional_data, media_player_entity_id=repeat.item.entity_id, message=final_tts
                        | trim) }}'
                - variables:
                    tts_deadline: '{{ as_timestamp(now()) + (tts_playback_timeout | float) }}'
                - repeat:
                    for_each: '{{ tts_snapshot }}'
                    sequence:
                    - wait_template: |-
                        {{ not has_value(repeat.item.entity_id)
                           or (as_timestamp(states[repeat.item.entity_id].last_changed) >= tts_dispatch_time | float
                               and states(repeat.item.entity_id) in ['playing', 'buffering', 'idle', 'paused', 'off']) }}
                      timeout:
                        seconds: '{{ [tts_start_timeout | float, [0, tts_deadline | float - as_timestamp(now())]
                          | max] | min }}'
                      continue_on_timeout: true
                    - wait_template: '{{ states(repeat.item.entity_id) not in [''playing'', ''buffering''] }}'
                      timeout:
                        seconds: '{{ [0, tts_deadline | float - as_timestamp(now())] | max }}'
                      continue_on_timeout: true
                    - if:
                      - condition: template
                        value_template: |-
                          {% set current = state_attr(repeat.item.entity_id, 'volume_level') %} {{ tts_restore_volume and repeat.item.volume is number and current is number
                             and (current - num_volume_speaker | float) | abs < 0.015 }}
                      then:
                      - action: media_player.volume_set
                        continue_on_error: true
                        target:
                          entity_id: '{{ repeat.item.entity_id }}'
                        data:
                          volume_level: '{{ repeat.item.volume }}'
            - if:
              - condition: template
                value_template: '{{ include_tts_to_mobile and filtered_tts_to_mobile | length > 0 }}'
              then:
              - repeat:
                  for_each: '{{ filtered_tts_to_mobile }}'
                  sequence:
                  - action: notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}
                    continue_on_error: true
                    data: |-
                      {% set extra = dict(tts_text=final_tts | trim) %}
                      {% if tts_to_mobile_media_stream_types in ['alarm_stream', 'alarm_stream_max'] %}
                        {% set extra = dict(extra, media_stream=tts_to_mobile_media_stream_types) %}
                      {% endif %}
                      {{ dict(message='TTS', data=extra) }}
              alias: TTS điện thoại — bỏ media_stream khi chọn chế độ thường
        - if:
          - condition: template
            value_template: '{{ not repeat.last }}'
          then:
          - &repeat_pause
            delay:
              seconds: '{{ repeat_delay }}'
  - conditions: '{{ repeat_types == ''until_repeat'' }}'
    sequence:
    - repeat:
        until:
        - condition: or
          conditions:
          - condition: and
            conditions: !input 'repeat_until'
          - condition: template
            value_template: '{{ repeat.index >= repeat_limit | int }}'
        sequence:
        - *notification_cycle
        - if:
          - condition: template
            value_template: '{{ repeat.index < repeat_limit | int }}'
          then:
          - *repeat_pause
  - conditions: '{{ repeat_types == ''while_repeat'' }}'
    sequence:
    - repeat:
        while:
        - condition: template
          value_template: '{{ repeat.index <= repeat_limit | int }}'
        - condition: and
          conditions: !input 'repeat_while'
        sequence:
        - *notification_cycle
        - if:
          - condition: template
            value_template: '{{ repeat.index < repeat_limit | int }}'
          then:
          - *repeat_pause
  - conditions: '{{ repeat_types == ''for_each_repeat'' }}'
    sequence:
    - repeat:
        for_each: '{{ repeat_for_each if repeat_for_each is sequence and repeat_for_each is not string and repeat_for_each
          is not mapping else [] }}'
        sequence:
        - *notification_cycle
        - if:
          - condition: template
            value_template: '{{ repeat.index < repeat_for_each | length }}'
          then:
          - *repeat_pause
  default:
  - *notification_cycle
- if:
  - condition: template
    value_template: '{{ include_custom_actions }}'
  then: !input 'custom_actions'
mode: !input 'execution_mode'
max: 10
max_exceeded: warning
