blueprint:
  name: AI Smart Camera Notification System
  description: >
    #### 📢 Chụp ảnh, quay video ngắn Phân tích ảnh video bằng AI và gửi Thông báo lên điện thoại, zalo, telegram, Discord và ra loa nếu Cảm biến kích hoạt và thực tế có người xuất hiện trong ảnh, video.

    <details>
    <summary><b>Chi tiết:</b> - Nhấn để mở rộng</summary>

      **Phiên bản: v.2025.10.22**

        - Chuyển sang dùng AI-Task

        - Bỏ lưu ảnh vào thư mục `www` chỉ lưu vào `Media`

      ***Tham khảo link dưới để thêm code vào trong configuration.yaml***

        - https://www.home-assistant.io/integrations/media_source/
        

      **Tác giả: Khaisilk1910 - Nguyễn Tiến Khải**

        1- **Các cảm biến dùng trong Blueprints: `Motion`(Chuyển động), `Presences`(Hiện diện), `Door`(Cửa)**

        2- **Thông báo phân tích hình ảnh, video bằng AI lên ứng dụng Home Assistant, Zalo, Telegram, Discord và TTS ra Loa được tích hợp vào Home Assistant 💬🔉**
        
        3- **Actions Settings: Nếu gửi thông báo lên Hass sẽ có thêm tùy chọn Actions trên thông báo để thực hiện Actions ngay trên thông báo Hass.**
        
        4- **Chỉ thông báo khi phát hiện `Có Người` trong ảnh**: do sử dụng AI phân tích và kết hợp điều kiện để loại bỏ thông báo ảo từ sensor khi thực tế không có người trong khung hình.

        5- **Có thể tùy chọn gửi thông báo lên nhiều Điện thoại, Telegram và lên nhiều Loa được tính hợp trong Home Assistant.**
        
        6- **Có thể thêm nhiều Hành động tùy chọn nếu muốn thực hiện.**
        
        7- **Có thể thêm nhiều Điều kiện để chạy Automation**
    </details>

  domain: automation
  homeassistant:
    min_version: 2026.3.0
  input:
    motion_sensor:
      name: 🚶 Trigger sensor
      description: Chọn cảm biến để kích hoạt chụp ảnh.
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
            - door

    global_conditions:
      name: 🛠️ Add Condition(s) to run this Automation
      description: |
        👉 Thêm Condition để chạy Automation.
        ⚠️ Automation chỉ chạy khi Conditions này là True.
      default: []
      selector:
        condition:

    camera_device:
      name: 📸 Camera
      description: |
        👉 Camera mà bạn muốn chụp ảnh
        📸 Thêm camera vào Hass tham khảo:
        🌐 Go2RTC: https://www.home-assistant.io/integrations/go2rtc/
        🌐 Onvif: https://www.home-assistant.io/integrations/onvif/
        🌐 Generic: https://www.home-assistant.io/integrations/generic/

      selector:
        entity:
          domain: camera
    zone_name:
      name: 📍 Zone Name
      description: |
        👉 Tên vị trí camera đang quan sát theo dõi
        ⚠️ Sẽ hiển thị trong nội dung phân tích khi gửi thông báo
      default: ""
      selector:
        text:
          multiline: false
    snapshot_settings:
      name: "Snapshot Settings"
      icon: mdi:camera-image
      collapsed: true
      input:
        overwrite_image:
          name: 🏞️ Overwrite Image (Optional)
          description: |
            👉 Tùy chọn lưu ảnh Ghi đè ảnh cũ (ảnh cũ sẽ bị ghi đè bởi ảnh mới)
            ⚠️ Nếu tắt tính năng này sẽ lưu nhiều ảnh, ảnh được đặt tên chứa `context.id` của mỗi lần chạy Automation và sẽ chiếm dung lượng server do lưu nhiều ảnh.
          default: true
          selector:
            boolean: {}
        ai_powered:
          name: ✅ AI-powered (Optional)
          description: |
            👉 Sử dụng AI để phân tích ảnh và đưa nội dung phân tích ảnh vào thông báo.
            ⚠️ Nếu sử dụng AI phân tích sẽ bị trễ thông báo vài giây so với ảnh chụp vì phải chờ thời gian AI phân tích ảnh xem có người mới gửi thông báo.
            ⚠️ Nếu không sử dụng AI sẽ hay bị gửi thông báo ảo khi không có người trong ảnh do sensor phát hiện nhầm có chuyển động do môi trường, động vật.
            🌐 Tham khảo thêm: https://www.home-assistant.io/integrations/ai_task/
          default: true
          selector:
            boolean: {}

        ai_provider:
          name: 🤖 Provider of AI
          description: |
            👉 Chọn AI sủ dụng cho việc phân tích ảnh.
            ⚠️ Nếu không Bật sử dụng AI bên trên không cần chọn
          selector:
            entity:
              domain: ai_task
          default: []

        is_structured_or_json:
          name: 📝 Android or iOS device?
          description: |
            👉 Chọn kiểu mà AI hỗ trợ Structured Output hay Json
          default: is_structured
          selector:
            select:
              options:
                - label: Structured output
                  value: "is_structured"
                - label: JSON
                  value: "is_json"

        ai_task_structured_instructions:
          name: ✍️ AI Task Structured Instructions
          description: |
            👉 Chuỗi chứa các hướng dẫn cụ thể để AI tuân theo khi tạo văn bản.
            ⚠️ Bạn có thể thay đổi nội dung này nếu kết quả phân tích ảnh không được như bạn mong muốn.
            🌐 Tham khảo thêm: https://www.home-assistant.io/integrations/ai_task/
          default: |
            Bạn là hệ thống thị giác máy tính giám sát camera. Hãy phân tích bối cảnh, đối tượng và hoạt động trong ảnh.
            RÀNG BUỘC BẮT BUỘC:
            1. Ngôn ngữ: 100% Tiếng Việt chuẩn.
            2. Định dạng: Chỉ trả về MỘT câu duy nhất, tuyệt đối không ngắt dòng.
            3. Giọng điệu: Trẻ trung, hóm hỉnh.
            4. Nội dung: Ngắn gọn tối đa, đi thẳng vào trọng tâm những gì đang diễn ra, không rườm rà thưa gửi.
          selector:
            template:

        ai_structure_description:
          name: 📝 AI Task Structure Description
          description: |
            👉 Từ điển xác định cấu trúc của dữ liệu đầu ra của nội dung phân tích ảnh.
            ⚠️ Bạn có thể thay đổi nội dung mẫu nếu muốn.
            🌐 Tham khảo thêm: https://www.home-assistant.io/integrations/ai_task/#action-ai_taskgenerate_data
          default: |
            Quét chuỗi ảnh và tập trung trích xuất dữ liệu của các chủ thể động (người, động vật, phương tiện).
            - Bỏ qua hoàn toàn cảnh quan, tòa nhà hoặc vật thể tĩnh. 
            - Đối với con người: chỉ rõ giới tính, độ tuổi (người lớn/trẻ em), hành động đang thực hiện, màu sắc và thể loại trang phục. **Đặc biệt, dựa vào sự thay đổi kích thước và vị trí của chủ thể giữa đầu và cuối chuỗi ảnh để kết luận hướng di chuyển: "đang đi vào" (nếu tiến gần camera, kích thước lớn dần) hoặc "đang đi ra" (nếu đi xa camera, kích thước nhỏ dần) hoặc "di chuyển ngang"**. 
            - Đối với động vật: xác định loài, vóc dáng và màu sắc đặc trưng.
            - Đối với phương tiện: phân loại (ô tô, xe máy, xe đạp...), màu sắc và kiểu dáng. 
            - Chú ý so sánh sự thay đổi giữa các khung hình. 
            - Nếu không có chủ thể nào thuộc 3 nhóm trên xuất hiện, hãy trả lời ngắn gọn: "Không ghi nhận biến động đối tượng".
          selector:
            template:

        ai_task_json_instructions:
          name: ✍️ AI Task JSON Instructions
          description: |
            👉 Chuỗi chứa các hướng dẫn cụ thể để AI tuân theo khi tạo văn bản.
            ⚠️ Bạn có thể thay đổi nội dung này nếu kết quả phân tích ảnh không được như bạn mong muốn.
            🌐 Tham khảo thêm: https://www.home-assistant.io/integrations/ai_task/
          default: |
            Đây là chuỗi hình ảnh từ máy ảnh của tôi.
            Hãy phân tích chuỗi ảnh này.
            Chỉ trả về JSON thuần, không giải thích thêm, theo đúng mẫu sau: {"humans_detected":0,"humans_detected_summary":"","humans_detected_description":""}
            Quy tắc từng trường:
            - humans_detected: số nguyên đếm tổng số người trong chuỗi ảnh.
            - humans_detected_summary: tóm tắt số lượng người theo loại, ví dụ "1 nữ, 2 trẻ em" hoặc "2 nam, 1 nữ". Nếu không có người trả về chuỗi rỗng.
            - humans_detected_description: mô tả chi tiết từng người bao gồm giới tính, trang phục màu sắc cụ thể, hành động đang làm. Ví dụ "Một phụ nữ mặc đồ bộ màu hồng cam đang ngồi chuẩn bị đồ ăn. Bên cạnh là một bé trai mặc đồ màu vàng cam đang đứng chơi.". Nếu không có người trả về "Đã phát hiện chuyển động tuy nhiên không có người trong chuỗi ảnh khi so sánh".
            QUAN TRỌNG:
            - BẮT BUỘC viết tiếng Việt có đầy đủ dấu.
            - TUYỆT ĐỐI KHÔNG viết tiếng Việt không dấu.
            - TUYỆT ĐỐI KHÔNG bọc kết quả trong markdown code block.
            - Chỉ trả về raw JSON thuần, bắt đầu bằng "{" và kết thúc bằng "}".
            - LOẠI BỎ **```json** và **```**.
            - TẤT CẢ NỘI DUNG TRÊN MỘT DÒNG DUY NHẤT, tuyệt đối không ngắt dòng.
            - Giọng điệu: Trẻ trung, hóm hỉnh.
            - Nội dung: Ngắn gọn tối đa, đi thẳng vào trọng tâm những gì đang diễn ra, không rườm rà thưa gửi.
          selector:
            template:

    record_video_settings:
      name: "Record Video Settings"
      icon: mdi:video-account
      collapsed: true
      input:
        record_video:
          name: 🎞️ Recording (Optional)
          description: |
            👉 Tùy chọn ghi video để gửi khi có phát hiện chuyển động.
            ⚠️ Mặc định ghi video 10s. Vì vậy thông báo video sẽ trễ hơn.
            ⚠️ Thời điểm ghi video vẫn là thời điểm kích hoạt bởi cảm biến chuyển động.
            ⚠️ Gửi video lên các nền tảng nhắn tin Zalo, Telegram, Discord.
            🌐 Tham khảo: https://www.home-assistant.io/integrations/camera/#action-record
          default: false
          selector:
            boolean: {}

        num_delay_ai_action:
          name: ⌛ Delay after Snapshots
          description: |
            👉 Thời gian trễ trước khi action phân tích video bằng AI
            ✅ Nếu dùng 1 AI Task cho phân tích ảnh và video nên set Delay phù hợp để tránh lỗi khi AI xử lý cùng lúc.
            ✅ Dùng Docker bạn nên nhân bản AI để dùng 2 AI Task riêng cho tác vụ ảnh và video 
            ⚠️ Set càng cao thông báo sẽ càng trễ nhưng vẫn là video được ghi lại tại thời điểm trigger như ảnh.
          selector:
            number:
              min: 0
              max: 120
              step: 1
              unit_of_measurement: seconds
          default: 10

        ai_powered_record_video:
          name: ✅ AI-powered (Optional)
          description: |
            👉 Sử dụng AI để phân tích ảnh và đưa nội dung phân tích ảnh vào thông báo.
            ⚠️ Nếu sử dụng AI phân tích sẽ bị trễ thông báo vài giây so với ảnh chụp vì phải chờ thời gian AI phân tích ảnh xem có người mới gửi thông báo.
            ⚠️ Nếu không sử dụng AI sẽ hay bị gửi thông báo ảo khi không có người trong ảnh do sensor phát hiện nhầm có chuyển động do môi trường, động vật.
            🌐 Tham khảo thêm: https://www.home-assistant.io/integrations/ai_task/
          default: true
          selector:
            boolean: {}

        ai_provider_record_video:
          name: 🤖 Provider of AI
          description: |
            👉 Chọn AI sủ dụng cho việc phân tích video.
          selector:
            entity:
              domain: ai_task
          default: []

        ai_task_instructions_record_video:
          name: ✍️ AI Task Instructions
          description: |
            👉 Chuỗi chứa các hướng dẫn cụ thể để AI tuân theo khi tạo văn bản.
            ⚠️ Bạn có thể thay đổi nội dung này nếu kết quả phân tích video không được như bạn mong muốn.
            🌐 Tham khảo thêm: https://www.home-assistant.io/integrations/ai_task/
          default: |
            Hệ thống phân tích thị giác máy tính (computer vision) thông minh, có nhiệm vụ giám sát chuỗi ảnh từ camera. 
            Quy tắc trả kết quả bắt buộc: 
            1. Sử dụng 100% Tiếng Việt chuẩn.
            2. Format kết quả thành một dòng văn bản duy nhất, tuyệt đối không có ký tự xuống dòng hay khoảng trắng thừa, ngắt câu bằng dấu phẩy và dấu chấm hợp lý. 3. Kết hợp các thuật ngữ phân tích không gian/hình ảnh nhưng diễn đạt bằng giọng văn trẻ trung, hóm hỉnh và mặn mòi. 
            4. Chỉ dùng văn bản thuần (plain text), tuyệt đối cấm sử dụng emoji hoặc biểu tượng. 
            5. Nội dung phải đi thẳng vào trọng tâm, ngắn gọn nhất có thể.
          selector:
            template:

        ai_structure_description_record_video:
          name: 📝 AI Task Structure Description
          description: |
            👉 Từ điển xác định cấu trúc của dữ liệu đầu ra của nội dung phân tích video.
            ⚠️ Bạn có thể thay đổi nội dung mẫu nếu muốn.
            🌐 Tham khảo thêm: https://www.home-assistant.io/integrations/ai_task/#action-ai_taskgenerate_data
          default: |
            Quét chuỗi ảnh và tập trung trích xuất dữ liệu của các chủ thể động (người, động vật, phương tiện).
            - Bỏ qua hoàn toàn cảnh quan, tòa nhà hoặc vật thể tĩnh. 
            - Đối với con người: chỉ rõ giới tính, độ tuổi (người lớn/trẻ em), hành động đang thực hiện, màu sắc và thể loại trang phục. **Đặc biệt, dựa vào sự thay đổi kích thước và vị trí của chủ thể giữa đầu và cuối chuỗi ảnh để kết luận hướng di chuyển: "đang đi vào" (nếu tiến gần camera, kích thước lớn dần) hoặc "đang đi ra" (nếu đi xa camera, kích thước nhỏ dần) hoặc "di chuyển ngang"**. 
            - Đối với động vật: xác định loài, vóc dáng và màu sắc đặc trưng.
            - Đối với phương tiện: phân loại (ô tô, xe máy, xe đạp...), màu sắc và kiểu dáng. 
            - Chú ý so sánh sự thay đổi giữa các khung hình. 
            - Nếu không có chủ thể nào thuộc 3 nhóm trên xuất hiện, hãy trả lời ngắn gọn: "Không ghi nhận biến động đối tượng".
          selector:
            template:

    mobile_app_notify_settings:
      name: "Mobile App Notify Settings"
      icon: mdi:devices
      collapsed: true
      input:
        include_notify:
          name: ✅ Mobile App Notify Option (Optional)
          description: |
            👉 Enable nếu muốn gửi thông báo lên điện thoại đã chọn bên dưới.
            🌐 Xem thêm tại https://companion.home-assistant.io/docs/notifications/notifications-basic
          default: false
          selector:
            boolean: {}
        is_ios_android:
          name: 🔔 Android or iOS device?
          description: |
            👉 Chọn điện thoại đẩy thông báo là Android hay iOS?
          default: android_device
          selector:
            select:
              options:
                - label: Android
                  value: "android_device"
                - label: iOS
                  value: "ios_device"
        notify_device:
          name: 📱 Devices Notified
          description: |
            👉 Chọn Điện thoại muốn thông bảo đẩy lên.
          default: []
          selector:
            device:
              filter:
                - integration: mobile_app
              multiple: true
        notify_title:
          name: 📝 Title
          description: |
            👉 Nhập Title của Thông báo.
            ⚠️ Có thẻ dùng CSS HTML để thiết lập màu sắc, In đậm,... cho nội dung
          default: >
            📢 <b><span style="color: red">Có chuyển động</span></b>
          selector:
            text:
        tap_navigate:
          name: 📲 Tap Navigate
          description: |
            👉 Mở Home Assistant và đi đến vị trí bên dưới khi Thông báo được mở.
            ⚠️ Ví dụ: /lovelace/cameras
          default: /lovelace/camera
          selector:
            text:
              multiline: false
              multiple: false
        status_bar_icon:
          name: "🌠 Status Bar Icon"
          description: |
            👉 `Dành cho Android`
            ⚠️ Thiết lập icon cho thông báo trên Status Bar điện thoại
            🌐 Tìm icon tại https://pictogrammers.com/library/mdi/
          default: mdi:motion-sensor
          selector:
            icon:
              placeholder: mdi:motion-sensor
        notification_color:
          name: "🎨 Notification Color"
          description: |
            👉 `Dành cho Android`
            ⚠️ Thiết lập màu cho icon thông báo trên Status Bar điện thoại
          default: [255, 0, 0]
          selector:
            color_rgb:
        include_actions:
          name: ✅ Use Actions For Mobile App Notify Option (Optional)
          description: |
            👉 Enable nếu muốn có Actions trong thông báo lên điện thoại đã chọn.
            🌐 Xem thêm tại https://companion.home-assistant.io/docs/notifications/actionable-notifications
          default: false
          selector:
            boolean: {}
        confirm_text:
          name: ✅ Confirmation Text
          description: |
            👉 Text to show on the confirmation button
          default: "✅ Confirm"
          selector:
            text:
        confirm_action:
          name: 👇 Confirmation Action
          description: |
            👉 Action to run when notification is confirmed
          default: []
          selector:
            action:
        dismiss_text:
          name: 📝 Dismiss Text
          description: |
            👉 Text to show on the dismiss button
          default: "❌ Dismiss"
          selector:
            text:
        enable_custom_dismiss_action:
          name: ✅ Custom Dismiss Action
          description: |
            👉 Display notification on Android Auto interface
          default: false
          selector:
            boolean: {}
        custom_dismiss_action:
          name: 👇 Custom Dismiss Action
          description: |
            👉 Action to run when notification is dismissed
          default: []
          selector:
            action:
        tag:
          name: "\U0001F516 Tag"
          description: |
            👉 Được sử dụng để định danh duy nhất thông báo.
            🌐 Tham khảo: https://companion.home-assistant.io/docs/notifications/actionable-notifications
          default: "dimiss_notifications_now"
          selector:
            text: {}
        timeout:
          name: ⌛️ Timeout Duration
          description: |
            👉 Khoảng thời gian chờ phản hồi hành động trước khi kích hoạt hành động khi hết thời gian chờ (timeout).
            ⚠️ Khuyến nghị: tối thiểu 1 phút để đảm bảo thông báo được gửi đi.
            ✅ Mặc định: 10 phút.
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration:
              enable_day: false
    zalo_settings:
      name: "Zalo Settings"
      icon: mdi:message-image-outline
      collapsed: true
      input:
        include_zalo_notify:
          name: ✅ Zalo Option (Optional)
          description: |
            👉 Enable nếu muốn gửi thông báo lên Zalo.
            🌐 Xem thêm https://github.com/smarthomeblack/zalo_bot
          default: false
          selector:
            boolean: {}
        zalo_group_id:
          name: 🧑‍💻 User or Group ID
          description: |
            👉 ID của User hoặc Group Zalo.
            ⚠️ Zalo Type bên dưới chọn User thì ở đây chỉ nhập ID của User
            ⚠️ Zalo Type bên dưới chọn Group thì ở đây chỉ nhập ID của Group
          selector:
            text:
              multiple: true
          default: ""
        zalo_phone:
          name: 📞 Zalo Acc
          description: |
            👉 Số điện thoại của Zalo Bot.
          selector:
            text:
          default: "+84376861184"
        zalo_types:
          name: 👨‍👨‍👦 Zalo Type Option (Optional)
          description: |
            👉 Chọn thông báo lên Zalo cá nhân hoặc group.
            ⚠️ Chọn `User` thì ở `User or Group ID` bên trên chỉ nhập ID của User
            ⚠️ Chọn `Group` thì ở `User or Group ID` bên trên chỉ nhập ID của Group
            Xem thêm tại https://github.com/smarthomeblack/zalo_bot
          default: "0"
          selector:
            select:
              options:
                - label: User
                  value: "0"
                - label: Group
                  value: "1"
        zalo_ttl:
          name: ⏳ TTL
          description: |
            👉 Thời gian chờ sau thời gian này tin nhắn sẽ tự xóa.
          selector:
            number:
              min: 0
              max: 86400000
              step: 1000
              unit_of_measurement: seconds
          default: 0
        zalo_video:
          name: 🎞️ Send Video (Optional)
          description: |
            👉 Tùy chọn có gửi video lên Zalo không?
          default: false
          selector:
            boolean: {}
    telegram_settings:
      name: "Telegram Settings"
      icon: mdi:message-badge
      collapsed: true
      input:
        include_telegram_notify:
          name: ✅ Telegram Option (Optional)
          description: |
            👉 Enable nếu muốn gửi thông báo lên Telegram.
            🌐 Xem thêm tại https://www.home-assistant.io/integrations/?search=telegram
          default: false
          selector:
            boolean: {}
        notify_tele_target:
          name: 📱 Notification targets
          description: |
            👉 Chọn bot muốn thông bảo đẩy lên.
          default: []
          selector:
            entity:
              filter:
                - domain: notify
                  integration: telegram_bot
              multiple: true
        telegram_topic:
          name: 🧑‍💻 Topic ID
          description: 👉 ID của chủ đề trong nhóm Telegram.
          selector:
            text:
          default: ""
        tele_video:
          name: 🎞️ Send Video (Optional)
          description: 👉 Tùy chọn có gửi video lên Telegram không?
          default: false
          selector:
            boolean: {}
    discord_settings:
      name: "Discord Settings"
      icon: mdi:message-bulleted
      collapsed: true
      input:
        include_discord_notify:
          name: ✅ Discord Option (Optional)
          description: |
            👉 Enable nếu muốn gửi thông báo lên Discord.
            🌐 Xem thêm https://www.home-assistant.io/integrations/discord/
          default: false
          selector:
            boolean: {}
        discord_provider:
          name: 🛠️ Config entry ID
          description: |
            👉 Choose Discord Bot to use for send Notifications.
            ⚠️ Vào `/config/integrations/integration/discord` copy tên của Bot rồi dán vào đây thay thế tên bot mặc định
          selector:
            text:
              multiline: false
          default: "hass_discord"
        discord_channel:
          name: 👨‍👨‍👦 Channel ID
          description: 👉 ID của Channel trong nhóm Discord
          selector:
            text:
          default: ""
       
        discord_video:
          name: 🎞️ Send Video (Optional)
          description: 👉 Tùy chọn có gửi video lên Discord không?
          default: false
          selector:
            boolean: {}
    tts_notify_settings:
      name: "TTS Settings"
      icon: mdi:speaker-message
      collapsed: true
      input:
        include_tts_announcement:
          name: ✅ Use The Text-to-Speech Announcement Option (Optional)
          description: |
            👉 Enable khi muốn gửi TTS ra loa sẽ chọn bên dưới.
            🌐 Xem thêm tại https://www.home-assistant.io/integrations/?search=tts
          default: false
          selector:
            boolean: {}
        num_volume_speaker:
          name: 🔊 Volume Set
          description: 👉 Thiết lập Âm lượng cho Loa. ( từ 0.1 đến 1)
          selector:
            number:
              min: 0.1
              max: 1
              step: 0.1
              #unit_of_measurement: snapshots
          default: 1
        text_to_speech_engine:
          name: 🗣️ Text-to-Speech Service Provider
          description: |
            👉 Chọn dịch vụ TTS hỗ trợ.
          default: []
          selector:
            entity:
              filter:
                domain: tts
        media_player:
          name: 🎶 Media Player
          description: |
            👉 Chọn loa để phát thông báo
          default: []
          selector:
            entity:
              filter:
                domain: media_player
              multiple: true
        include_custom_media_player:
          name: ✅ Use Custom Media Player Option (Optional)
          description: |
            👉 Enable khi muốn thêm Media Player custom dạng sensor
          default: false
          selector:
            boolean: {}
        custom_media_player:
          name: 🎶 Custom Media Player
          description: |
            👉 Nhập Sensor đã có với state là các loa
          default: ""
          selector:
            template:

    delay_settings:
      name: "Delay Settings"
      icon: mdi:clock-start
      collapsed: true
      input:
        num_snapshots:
          name: ⌛ Number of Snapshots
          description: 👉 Số ảnh sẽ chụp để so sánh (từ 1 đến 5)
          selector:
            number:
              min: 1
              max: 5
              step: 1
              unit_of_measurement: snapshots
          default: 1
        num_delay:
          name: ⌛ Delay after Snapshots
          description: 👉 Thời gian trễ sau mỗi lần Snapshots (tính theo giây)
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: seconds
          default: 0
        num_delay_actions:
          name: ⌛ Delays
          description: |
            👉 Thời gian chờ sau khi hoàn thành tất cả các hành động (tính theo giây)
            ⚠️ Automation này chỉ hoạt động lại sau khi hết thời gian Delay này.
          selector:
            number:
              min: 5
              max: 1200
              step: 5
              unit_of_measurement: seconds
          default: 10
    custom_actions_settings:
      name: "Custom Actions"
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        include_custom_actions:
          name: ✅ Use The Custom Action Options (Optional)
          description: |
            👉 Chọn Enable Custom Actions và thêm Actions bên dưới nếu bạn muốn thêm các Hành động khác để thực hiện trong Automation này.
          default: false
          selector:
            boolean: {}
        custom_actions:
          name: 🛠️ Custom Actions
          description: |
            👉 Thêm bất kỳ hành động nào bạn muốn chạy trong Automation này.
            ⚠️ Biến lấy nội dung phân tích AI cho các nội dung khác: `humans_detected_report.data.humans_detected_description`
          default: []
          selector:
            action:

trigger:
  platform: state
  entity_id: !input motion_sensor
  to: "on"

variables:
  zone_name: !input zone_name
  overwrite_image: !input overwrite_image
  #Record Video Settings
  record_video: !input record_video
  num_delay_ai_action: !input num_delay_ai_action
  ai_powered_record_video: !input ai_powered_record_video
  ai_provider_record_video: !input ai_provider_record_video
  ai_task_instructions_record_video: !input ai_task_instructions_record_video
  ai_structure_description_record_video: !input ai_structure_description_record_video
  #AI
  ai_powered: !input ai_powered
  ai_provider: !input ai_provider
  ai_task_structured_instructions: !input ai_task_structured_instructions
  ai_structure_description: !input ai_structure_description
  is_structured_or_json: !input is_structured_or_json
  ai_task_json_instructions: !input ai_task_json_instructions
  #Device Notify
  include_notify: !input include_notify
  notify_device: !input notify_device
  notify_title: !input notify_title
  tap_navigate: !input tap_navigate
  filtered_devices: >
    {{ notify_device }}
  is_ios_android: !input is_ios_android
  #Actions Settings
  include_actions: !input include_actions
  confirm_text: !input confirm_text
  dismiss_text: !input dismiss_text
  timeout: !input timeout
  enable_custom_dismiss_action: !input enable_custom_dismiss_action
  tag: !input tag
  #Zalo Message
  zalo_video: !input zalo_video
  include_zalo_notify: !input include_zalo_notify
  zalo_group_id: !input zalo_group_id
  filtered_zalo_id: >
    {{ (zalo_group_id if zalo_group_id is iterable and zalo_group_id is not string else [zalo_group_id|string]) | map('string') | list | tojson }}
  #Telegram Message
  include_telegram_notify: !input include_telegram_notify
  notify_tele_target: !input notify_tele_target
  telegram_topic: !input telegram_topic
  tele_video: !input tele_video
  tele_title: >
    {{ notify_title | regex_replace('<span[^>]*>', '') | replace('</span>', '') if '<span' in notify_title else notify_title }}
  #Discord
  include_discord_notify: !input include_discord_notify
  discord_provider: !input discord_provider
#  filtered_discord: >
#    {{ discord_provider }}
  discord_channel: !input discord_channel
  discord_video: !input discord_video
  #Camera
  camera_device: !input camera_device
  camera_name: "{{ state_attr(camera_device, 'friendly_name') }}"
  camera_path: "{{ state_attr(camera_device, 'friendly_name') | slugify }}"
  #camera_path: "{{ state_attr(camera_device, 'friendly_name') | lower | replace(' ', '_') }}"
  #Motion Sensor
  motion_sensor: !input motion_sensor
  motion_name: "{{ state_attr(motion_sensor, 'friendly_name') }}"
  #Snapshot
  num_delay_actions: !input num_delay_actions
  num_snapshots: !input num_snapshots
  num_delay: !input num_delay
  #TTS Message
  include_tts_announcement: !input include_tts_announcement
  num_volume_speaker: !input num_volume_speaker
  text_to_speech_engine: !input text_to_speech_engine
  media_player: !input media_player
  include_custom_media_player: !input include_custom_media_player
  custom_media_player: !input custom_media_player
  #Custom Actions
  include_custom_actions: !input include_custom_actions
  custom_actions: !input custom_actions
  #Global Conditions
  global_conditions: !input global_conditions

# All Conditions
condition:
  # Global Conditions
  - condition: and
    conditions: !input global_conditions

action:
  - variables:
      filtered_telegram_target: >
        {{ notify_tele_target }}
      file_path: >
        {% if overwrite_image %}
          {{camera_path}}
        {% else %}
          {{camera_path}}_{{context.id}}
        {% endif %}
      action_confirm: "{{ 'CONFIRM_' ~ context.id }}"
      action_dismiss: "{{ 'DISMISS_' ~ context.id }}"
      notification_color: !input "notification_color"
      notification_color_hex: "#{{ '%02x%02x%02x' | format(notification_color[0], notification_color[1], notification_color[2]) }}"
      is_custom_media_player: >
        {{ custom_media_player if include_custom_media_player else media_player }}

  - variables:
      snapshot_access_file_path: "/media/local/snapshots/{{file_path}}_snapshot1.jpg"
      snapshot_access_file_path_social: "/media/snapshots/{{file_path}}_snapshot1.jpg"
      is_zone_name: >
        {{ camera_name if zone_name == '' else zone_name }}
      is_wait_completed_error: "Chờ phát thông báo không thành công. Hãy kiểm tra loa hoặc thử lại Automation này."
        
  - alias: "Chạy cùng lúc tất cả các action"
    parallel:
      - alias: "Chạy lần lượt các action"
        sequence:
          - repeat:
              count: "{{ num_snapshots }}"
              sequence:
                - action: camera.snapshot
                  data:
                    filename: "/media/snapshots/{{ file_path }}_snapshot{{ repeat.index }}.jpg"
                  target:
                    entity_id: "{{ camera_device }}"
                - delay:
                    seconds: "{{ num_delay }}"

          - variables:
              snapshots_url: >
                {% set snap_count = num_snapshots | int %}
                {% set camera = file_path %}
                {% set ns = namespace(images=[]) %}
                {%- for i in range(1, snap_count + 1) -%}
                  {% set ns.images = ns.images + [{'media_content_id': 'media-source://media_source/local/snapshots/' ~ camera ~ '_snapshot' ~ i ~ '.jpg', 'media_content_type': 'image/jpeg'}] %}
                {%- endfor -%}
                {{ ns.images }}
          - choose:
              - alias: "Check if AI is enabled"
                conditions:
                  - "{{ ai_powered }}"
                sequence:
                  - alias: "Chọn Structured output hoặc JSON"
                    if:
                      - condition: template
                        value_template: "{{ is_structured_or_json == 'is_structured' }}"
                    then:
                      - action: ai_task.generate_data
                        data:
                          task_name: Phan tich anh khi co chuyen dong
                          instructions: "{{ ai_task_structured_instructions }}"
                          entity_id: "{{ ai_provider }}"
                          attachments: "{{ snapshots_url }}"
                          structure:
                            humans_detected:
                              description: Đếm số người trong chuỗi ảnh
                              required: true
                              selector:
                                number: null
                            humans_detected_description:
                              description: "{{ ai_structure_description }}"
                              required: true
                              selector:
                                text: null
                        response_variable: humans_detected_report
                        continue_on_error: true
                    else:
                      - action: ai_task.generate_data
                        data:
                          task_name: Phan tich anh khi co chuyen dong
                          instructions: "{{ ai_task_json_instructions }}"
                          entity_id: "{{ ai_provider }}"
                          attachments: "{{ snapshots_url }}"
                        response_variable: humans_detected_report
                        continue_on_error: true
                      - alias: "Nếu AI lỗi sẽ gửi trực tiếp ảnh và thông báo không phân tích"
                        if:
                          - condition: template
                            value_template: "{{ humans_detected_report is defined }}"
                        then:
                          - variables:
                              json_data: >
                                {{ (humans_detected_report.data | replace('```json', '') | replace('```','') | trim) | from_json }}
                              humans_detected: "{{ json_data.humans_detected }}"
                              humans_detected_description: "{{ json_data.humans_detected_description }}"
                  - alias: "Nếu AI lỗi sẽ gửi trực tiếp ảnh và thông báo không phân tích"
                    if:
                      - condition: template
                        value_template: >
                          {% if is_structured_or_json == 'is_structured' %}
                            {{ humans_detected_report is not defined or humans_detected_report.data.humans_detected is not defined or humans_detected_report.data.humans_detected == '' or humans_detected_report.data.humans_detected_description is not defined or humans_detected_report.data.humans_detected_description == '' }}
                          {% else %}
                            {{ humans_detected_report is not defined }}
                          {% endif %}
                    then:

                      - variables:
                          ai_messages_not_complete: >
                            📢 AI đang lỗi không phân tích được ảnh{{'\n'}}Hãy kiểm tra trạng thái hoạt động của AI{{'\n'}}{{'\n'}}🕒 {{now().strftime('%H:%M:%S %a, %d-%b-%Y')}}
                          ai_tts_not_complete: >
                            AI đang lỗi không phân tích được ảnh. Hãy kiểm tra trạng thái hoạt động của AI

                      - action: system_log.write
                        metadata: {}
                        data:
                          level: info
                          message: AI đang lỗi không phân tích được ảnh. Hãy kiểm tra trạng thái hoạt động của AI
                          logger: AI Error - AI Camera Khaisilk1910

                      - alias: "Chạy cùng lúc tất cả các Action"
                        parallel:
                          - if:
                              - condition: template
                                value_template: "{{ include_notify and (filtered_devices | length > 0) }}"
                            then:
                              - if:
                                  - condition: template
                                    value_template: "{{ include_actions }}"
                                then:
                                  - choose:
                                      - alias: "Check if Android"
                                        conditions:
                                          - "{{ is_ios_android == 'android_device' }}"
                                        sequence:
                                          - alias: Send a notification to each device
                                            repeat:
                                              for_each: "{{ filtered_devices }}"
                                              sequence:
                                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                  data:
                                                    title: !input notify_title
                                                    message: "{{ ai_messages_not_complete }}"
                                                    data:
                                                      priority: high
                                                      notification_icon: !input status_bar_icon
                                                      color: "{{ notification_color_hex }}"
                                                      image: "{{snapshot_access_file_path}}"
                                                      url: "{{tap_navigate}}"
                                                      clickAction: "{{tap_navigate}}"
                                                      tag: "{{ tag }}"
                                                      actions:
                                                        - action: "{{ action_confirm }}"
                                                          title: "{{ confirm_text }}"
                                                        - action: "{{ action_dismiss }}"
                                                          title: "{{ dismiss_text }}"
                                      - alias: "Check if iOS"
                                        conditions:
                                          - "{{ is_ios_android == 'ios_device' }}"
                                        sequence:
                                          - alias: Send a notification to each device
                                            repeat:
                                              for_each: "{{ filtered_devices }}"
                                              sequence:
                                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                  data:
                                                    title: !input notify_title
                                                    message: >
                                                      {{ ai_messages_not_complete }}
                                                    data:
                                                      attachment:
                                                        url: "{{snapshot_access_file_path}}"
                                                        content_type: "JPEG"
                                                      tag: "{{ tag }}"
                                                      actions:
                                                        - action: "{{ action_confirm }}"
                                                          title: "{{ confirm_text }}"
                                                        - action: "{{ action_dismiss }}"
                                                          title: "{{ dismiss_text }}"
                                  - alias: "Awaiting response"
                                    wait_for_trigger:
                                      - platform: event
                                        event_type: mobile_app_notification_action
                                        event_data:
                                          action: "{{ action_confirm }}"
                                      - platform: event
                                        event_type: mobile_app_notification_action
                                        event_data:
                                          action: "{{ action_dismiss }}"
                                    timeout: '{{ timeout }}'
                                    continue_on_timeout: true
                                  - choose:
                                      - conditions: "{{ wait.trigger.event.data.action == action_confirm }}"
                                        sequence: !input confirm_action
                                      - conditions: "{{ wait.trigger.event.data.action == action_dismiss }}"
                                        sequence:
                                          - alias: Nếu Enable Custom Dismiss Action được Bật thì sẽ hành động theo Custom Dismiss Action. Còn không thì sẽ xóa Thông báo.
                                            if:
                                              - condition: template
                                                value_template: "{{ not enable_custom_dismiss_action}}"
                                            then:
                                              - alias: Send a notification to each device
                                                repeat:
                                                  for_each: "{{ filtered_devices }}"
                                                  sequence:
                                                    - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                      data:
                                                        message: "clear_notification"
                                                        data:
                                                          tag: "{{ tag }}"
                                            else:
                                              - alias: Send a notification to each device
                                                repeat:
                                                  for_each: "{{ filtered_devices }}"
                                                  sequence: !input custom_dismiss_action
                                else:
                                  - choose:
                                      - alias: "Check if Android"
                                        conditions:
                                          - "{{ is_ios_android == 'android_device' }}"
                                        sequence:
                                          - alias: Send a notification to each device
                                            repeat:
                                              for_each: "{{ filtered_devices }}"
                                              sequence:
                                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                  data:
                                                    title: !input notify_title
                                                    message: "{{ ai_messages_not_complete }}"
                                                    data:
                                                      priority: high
                                                      notification_icon: !input status_bar_icon
                                                      color: "{{ notification_color_hex }}"
                                                      image: "{{snapshot_access_file_path}}"
                                                      url: "{{tap_navigate}}"
                                                      clickAction: "{{tap_navigate}}"
                                      - alias: "Check if iOS"
                                        conditions:
                                          - "{{ is_ios_android == 'ios_device' }}"
                                        sequence:
                                          - alias: Send a notification to each device
                                            repeat:
                                              for_each: "{{ filtered_devices }}"
                                              sequence:
                                                - action: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                                                  data:
                                                    title: !input notify_title
                                                    message: >
                                                      {{ ai_messages_not_complete }}
                                                    data:
                                                      attachment:
                                                        url: "{{snapshot_access_file_path}}"
                                                        content_type: "JPEG"

                          - if:
                              - condition: template
                                value_template: "{{ include_zalo_notify and (filtered_zalo_id | length > 0) }}"
                            then:
                              - alias: Send a notification to each device
                                repeat:
                                  for_each: "{{ filtered_zalo_id }}"
                                  sequence:
                                    - action: zalo_bot.send_image
                                      metadata: {}
                                      data:
                                        type: !input zalo_types
                                        image_path: "{{ snapshot_access_file_path_social }}"
                                        message: "{{ ai_messages_not_complete }}"
                                        thread_id: "{{ repeat.item }}"
                                        account_selection: !input zalo_phone
                                        ttl: !input zalo_ttl

                          - if:
                              - condition: template
                                value_template: "{{ include_telegram_notify }}"
                            then:
                              - alias: Send a notification to each bot
                                repeat:
                                  for_each: "{{ filtered_telegram_target }}"
                                  sequence:
                                    - action: telegram_bot.send_photo
                                      data:
                                        verify_ssl: false
                                        entity_id: "{{repeat.item}}"
                                        message_thread_id: "{{ telegram_topic | int(0) }}"
                                        file: "{{ snapshot_access_file_path_social }}"
                                        caption: >
                                          {{ ai_messages_not_complete }}


                          - if:
                              - condition: template
                                value_template: "{{ include_discord_notify }}"
                            then:
                              - action: "notify.{{ discord_provider | slugify }}" #notify.hass_discord
                                metadata: {}
                                data:
                                  target: "{{discord_channel | int(0)}}"
                                  data:
                                    images:
