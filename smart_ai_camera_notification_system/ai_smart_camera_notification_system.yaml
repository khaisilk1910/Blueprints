                              description: "{{ ai_structure_description_record_video }}"
                              required: true
                              selector:
                                text: null
                        response_variable: humans_detected_report_video
                        continue_on_error: true

                      - alias: "Nếu AI lỗi sẽ gửi trực tiếp ảnh và thông báo không phân tích"
                        if:
                          - condition: template
                            value_template: "{{ humans_detected_report_video is not defined or humans_detected_report_video.data.humans_detected_video is not defined or humans_detected_report_video.data.humans_detected_video == '' or humans_detected_report_video.data.humans_detected_description_video is not defined or humans_detected_report_video.data.humans_detected_description_video == '' }}"
                        then:
                          - variables:
                              ai_record_not_complete: >
                                🚨 AI đang lỗi không phân tích được Video{{'\n'}}⚠️ Hãy kiểm tra trạng thái hoạt động của AI{{'\n'}}{{'\n'}}🕒 {{now().strftime('%H:%M:%S %a, %d-%b-%Y')}}

                          - action: system_log.write
                            metadata: {}
                            data:
                              level: info
                              message: AI đang lỗi không phân tích được Video. Hãy kiểm tra trạng thái hoạt động của AI
                              logger: AI Error - AI Camera Record Khaisilk1910

                          - alias: "Chạy cùng lúc tất cả các action"
                            parallel:
                              - if:
                                  - condition: template
                                    value_template: "{{ include_zalo_notify and zalo_video and (filtered_zalo_id | length > 0) }}"
                                then:
                                  - alias: Send a notification to each device
                                    repeat:
                                      for_each: "{{ filtered_zalo_id }}"
                                      sequence:
                                        - action: zalo_bot.send_video
                                          metadata: {}
                                          data:
                                            message: "{{ ai_record_not_complete }}"
                                            ttl: !input zalo_ttl
                                            type: !input zalo_types
                                            video_path_or_url: "{{ url_video }}"
                                            thumbnail_url: "{{ thumbnail_url_record }}"
                                            account_selection: !input zalo_phone
                                            thread_id: "{{ repeat.item }}"
                                            width: 1280
                                            height: 720

                              - if:
                                  - condition: template
                                    value_template: "{{ include_telegram_notify and tele_video }}"
                                then:
                                  - alias: Send a notification to each bot
                                    repeat:
                                      for_each: "{{ filtered_telegram_target }}"
                                      sequence:
                                        - action: telegram_bot.send_video
                                          metadata: {}
                                          data:
                                            verify_ssl: false
                                            entity_id: "{{repeat.item}}"
                                            file:  "{{ url_video }}"
                                            caption: >
                                              {{ ai_record_not_complete }}
                                            message_thread_id: "{{ telegram_topic | int(0) }}"

                              - if:
                                  - condition: template
                                    value_template: "{{ include_discord_notify and discord_video }}"
                                then:
                                  - action: "notify.{{ discord_provider | slugify }}"
                                    metadata: {}
                                    data:
                                      target: "{{discord_channel | int(0)}}"
                                      data:
                                        images:
                                          - "{{ url_video }}"
                                      message: >
                                        {{ ai_record_not_complete }}

                        else:
                          - wait_template: "{{ humans_detected_report_video is defined and humans_detected_report_video.data.humans_detected_description_video is defined and humans_detected_report_video.data.humans_detected_video is defined  }}"
                            timeout: "00:02:00"
                            continue_on_timeout: true
                          - if:
                              - condition: template
                                value_template: "{{ wait.completed }}"
                            then:

                              - variables:
                                  ai_messages_record: >
                                    📍 {{is_zone_name}} | 🚶: {{ humans_detected_report_video.data.humans_detected_video }}{{'\n'}}🎞️👉 {{ humans_detected_report_video.data.humans_detected_description_video }}{{'\n'}}🕒 {{now().strftime('%H:%M:%S %a, %d-%b-%Y')}}
                              - if:
                                  - condition: template
                                    value_template: >
                                      {{ not (humans_detected_report_video.data.humans_detected_video|int(0) == 0) }}
                                then:
                                  - alias: "Chạy cùng lúc tất cả các action"
                                    parallel:
                                      - if:
                                          - condition: template
                                            value_template: "{{ include_zalo_notify and zalo_video and (filtered_zalo_id | length > 0) }}"
                                        then:
                                          - alias: Send a notification to each device
                                            repeat:
                                              for_each: "{{ filtered_zalo_id }}"
                                              sequence:
                                                - action: zalo_bot.send_video
                                                  metadata: {}
                                                  data:
                                                    message: "{{ ai_messages_record }}"
                                                    ttl: !input zalo_ttl
                                                    type: !input zalo_types
                                                    video_path_or_url: "{{ url_video }}"
                                                    thumbnail_url: "{{ thumbnail_url_record }}"
                                                    account_selection: !input zalo_phone
                                                    thread_id: "{{ repeat.item }}"
                                                    width: 1280
                                                    height: 720

                                      - if:
                                          - condition: template
                                            value_template: "{{ include_telegram_notify and tele_video }}"
                                        then:
                                          - alias: Send a notification to each bot
                                            repeat:
                                              for_each: "{{ filtered_telegram_target }}"
                                              sequence:
                                                - action: telegram_bot.send_video
                                                  metadata: {}
                                                  data:
                                                    verify_ssl: false
                                                    entity_id: "{{repeat.item}}"
                                                    file:  "{{ url_video }}"
                                                    caption: >
                                                      {{ ai_messages_record }}
                                                    message_thread_id: "{{ telegram_topic | int(0) }}"

                                      - if:
                                          - condition: template
                                            value_template: "{{ include_discord_notify and discord_video }}"
                                        then:
                                          - action: "notify.{{ discord_provider | slugify }}"
                                            metadata: {}
                                            data:
                                              target: "{{discord_channel | int(0)}}"
                                              data:
                                                images:
                                                  - "{{ url_video }}"
                                              message: >
                                                {{ ai_messages_record }}
                            else:
                              - action: system_log.write
                                metadata: {}
                                data:
                                  level: info
                                  message: Kết thúc Automation do AI phân tích video không thành công.
                                  logger: AI Camera Khaisilk1910
                              - stop: Kết thúc Automation do AI phân tích video không thành công.

                  - alias: "Check if AI is disable"
                    conditions:
                      - "{{ not ai_powered }}"
                    sequence:
                      - variables:
                          ai_disable_messages_record: >
                            📸 {{camera_name}} | 🚶 Phát hiện chuyển động{{'\n'}}{{'\n'}}🕒 {{now().strftime('%H:%M:%S %a, %d-%b-%Y')}}
                      - alias: "Chạy cùng lúc tất cả các action"
                        parallel:
                          - if:
                              - condition: template
                                value_template: "{{ include_zalo_notify and zalo_video and (filtered_zalo_id | length > 0) }}"
                            then:
                              - alias: Send a notification to each device
                                repeat:
                                  for_each: "{{ filtered_zalo_id }}"
                                  sequence:
                                    - action: zalo_bot.send_video
                                      metadata: {}
                                      data:
                                        message: "{{ ai_disable_messages_record }}"
                                        ttl: !input zalo_ttl
                                        type: !input zalo_types
                                        video_path_or_url: "{{ url_video }}"
                                        thumbnail_url: snapshot_access_file_path
                                        account_selection: !input zalo_phone
                                        thread_id: "{{ repeat.item }}"
                                        width: 1280
                                        height: 720

                          - if:
                              - condition: template
                                value_template: "{{ include_telegram_notify and tele_video }}"
                            then:
                              - alias: Send a notification to each bot
                                repeat:
                                  for_each: "{{ filtered_telegram_target }}"
                                  sequence:
                                    - action: telegram_bot.send_video
                                      metadata: {}
                                      data:
                                        verify_ssl: false
                                        entity_id: "{{repeat.item}}"
                                        file:  "{{ url_video }}"
                                        caption: "{{ ai_disable_messages_record }}"
                                        message_thread_id: "{{ telegram_topic | int(0) }}"


                          - if:
                              - condition: template
                                value_template: "{{ include_discord_notify and discord_video }}"
                            then:
                              - action: "notify.{{ discord_provider | slugify }}"
                                metadata: {}
                                data:
                                  target: "{{discord_channel | int(0)}}"
                                  data:
                                    images:
                                      - "{{ url_video }}"
                                  message: "{{ ai_disable_messages_record }}"


  - choose:
      - alias: "Perform the custom action"
        conditions:
          - condition: template
            value_template: "{{ include_custom_actions }}"
        sequence: !input custom_actions

  - delay:
      seconds: "{{ num_delay_actions }}"
      
mode: single
#mode: restart
#mode: parallel
#max: 10
max_exceeded: silent
